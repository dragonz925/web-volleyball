<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Web Volleyball</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8ecf7; --panel:#ffffff; --panel2:#f1f4fb; --ink:#161a3d; --muted:#5c6386; --line:#d6dcee;
  --navy:#1b1e4b; --navy2:#252a66; --board:#0f1233; --yellow:#ffc93c; --blue:#2d6bff; --orange:#f2783a; --red:#ff4d5e; --green:#2fbf71;
  --common:#8a93a8; --rare:#2d6bff; --epic:#9a4de6; --legendary:#f0a00c; --mythic:#ff3d7f;
  --disp:"Dela Gothic One","Arial Black",Impact,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10122e; --panel:#1a1d45; --panel2:#14173a; --ink:#eef0ff; --muted:#9aa0c8; --line:#2c3168; --navy:#20245c; --navy2:#2b3075; --board:#0b0d26;
}}
:root[data-theme="dark"]{--bg:#10122e; --panel:#1a1d45; --panel2:#14173a; --ink:#eef0ff; --muted:#9aa0c8; --line:#2c3168; --navy:#20245c; --navy2:#2b3075; --board:#0b0d26;}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"M PLUS Rounded 1c",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:500;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input{font:inherit}
button{cursor:pointer;border:none;border-radius:14px;padding:.75em 1.1em;font-weight:800;transition:transform .08s,box-shadow .08s}
button:active:not(:disabled){transform:translateY(2px)}
button:focus-visible,input:focus-visible,.tile:focus-visible,.item:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button:disabled{opacity:.38;cursor:not-allowed}
input{border:2px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:14px;padding:.7em .9em;min-width:0;font-weight:700}
.o{background:var(--yellow);color:#1b1e4b;box-shadow:0 4px 0 #c99412}
.o:active:not(:disabled){box-shadow:0 2px 0 #c99412}
.b{background:var(--blue);color:#fff;box-shadow:0 4px 0 #1b48c4}
.b:active:not(:disabled){box-shadow:0 2px 0 #1b48c4}
.g{background:var(--panel);color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.logo{font-family:var(--disp);font-size:1.7rem;letter-spacing:-.01em;color:var(--ink);display:inline-flex;align-items:center;gap:.35em}
.logo::before{content:"";width:1em;height:1em;border-radius:50%;background:conic-gradient(var(--yellow) 0 120deg,var(--blue) 120deg 240deg,#fff 240deg);box-shadow:inset 0 0 0 2px var(--navy)}
.logo .s,.logo .a{color:inherit}
.top-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:.35em .85em;font-size:.88rem;font-weight:800}
.pill.warn{border-color:var(--red);color:var(--red)}.pill.warn .dot{background:var(--red);animation:blink 1s steps(2) infinite}@keyframes blink{50%{opacity:.2}}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--green);margin-right:6px;vertical-align:1px}
.leave{background:transparent;color:var(--muted);border:2px solid var(--line);padding:.5em .9em}
.hint{color:var(--muted);font-size:.88rem;margin:0}
.err{color:var(--red);font-weight:700;min-height:1.2em;margin:0;font-size:.9rem}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row input{flex:1}
.big{font-size:1.08rem;padding:.9em 1.2em}
.sm{padding:.45em .85em;font-size:.85rem;border-radius:999px;box-shadow:none}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:12px}
.panel h2{margin:0;font-size:1rem;color:var(--muted);font-weight:800}
.tiers{display:flex;flex-wrap:wrap;gap:6px}
.tier{border-radius:8px;padding:.25em .6em;color:#fff;font-weight:800;font-size:.75rem}

/* speed lines (manga burst) */
.burst{position:absolute;left:50%;top:50%;width:200%;aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;
  background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--rc,#fff) 70%,transparent) 0 2.5deg,transparent 2.5deg 9deg);
  -webkit-mask:radial-gradient(circle,transparent 12%,#000 24%,transparent 62%);mask:radial-gradient(circle,transparent 12%,#000 24%,transparent 62%);opacity:.45}
.burst.go{animation:burst .8s cubic-bezier(.2,.9,.3,1)}
@keyframes burst{from{opacity:1;transform:translate(-50%,-50%) scale(.4) rotate(-20deg)}}

/* home */
.home{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
@media(max-width:840px){.home{grid-template-columns:1fr}}
.hero{background:var(--navy);border-radius:28px;color:#fff;padding:32px;position:relative;overflow:hidden;min-height:440px;display:flex;flex-direction:column;justify-content:flex-end;--rc:var(--yellow)}
.hero::before{content:"";position:absolute;left:50%;top:150px;width:170%;aspect-ratio:1;transform:translate(-50%,-50%);
  background:repeating-conic-gradient(from 0deg,rgba(255,201,60,.16) 0 2.5deg,transparent 2.5deg 9deg);
  -webkit-mask:radial-gradient(circle,transparent 8%,#000 22%,transparent 55%);mask:radial-gradient(circle,transparent 8%,#000 22%,transparent 55%)}
.hero h1{position:relative;font-family:var(--disp);font-weight:400;font-size:clamp(2.1rem,5.4vw,3.5rem);line-height:1.02;margin:0 0 12px;max-width:12ch}
.hero p{position:relative;color:#c9cdf2;max-width:38ch;margin:0}
.hero .fan{position:absolute;top:34px;left:50%;transform:translateX(-50%);display:flex;padding-left:30px}
.hero .fan>div:nth-child(2){position:relative;z-index:2;--y:-8px}
.hero .fan>div{margin-left:-30px;transform:translateY(var(--y)) rotate(var(--r))}
.hero .fan .card{width:124px;box-shadow:0 14px 30px rgba(0,0,0,.45)}
@media(max-width:560px){.hero{min-height:400px}.hero .fan{transform:translateX(-50%) scale(.8);transform-origin:top center}}
.me-row{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:2px solid var(--line)}
.me-row .who{flex:1;min-width:0}
.who b{font-size:1.15rem;font-weight:800;display:block}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.85rem;font-weight:700}
.or::before,.or::after{content:"";flex:1;height:2px;background:var(--line)}
.gem{font-weight:800}

/* game */
.game{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media(max-width:940px){.game{grid-template-columns:1fr}}
.stage{background:var(--navy);border-radius:28px;color:#fff;position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);min-height:400px}
@media(max-width:640px){.stage{grid-template-columns:1fr}}
.lot-side{position:relative;display:grid;place-items:center;padding:30px 20px;overflow:hidden}
.lot-side .card{position:relative;z-index:1;transform:rotate(-3deg);box-shadow:0 18px 40px rgba(0,0,0,.45)}
.board{position:relative;z-index:1;margin:16px 16px 16px 0;background:var(--board);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
@media(max-width:640px){.board{margin:0 16px 16px}}
.board-top{display:flex;justify-content:space-between;font-size:.82rem;color:#9aa0c8;font-weight:700}
.board-top b{color:#fff}
.lbl{font-size:.82rem;color:#9aa0c8;font-weight:700}
.price{font-family:var(--disp);font-size:clamp(3rem,7vw,4.4rem);line-height:1;color:var(--yellow);font-variant-numeric:tabular-nums;text-shadow:0 0 24px rgba(255,201,60,.35)}
.price.bump{animation:bump .3s}
@keyframes bump{40%{transform:scale(1.08)}}
.ldrow{display:flex;align-items:center;gap:10px;min-height:52px}
.leader{font-weight:800;font-size:1.02rem}
.leader.mine{color:#5ef0a0}
.timer{height:10px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden}
.timer div{height:100%;background:var(--blue);border-radius:99px}
.timer.low div{background:var(--red)}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.btns button{padding:.8em .3em}
.btns .pass{grid-column:1/-1;background:rgba(255,255,255,.08);color:#d8dbf5;box-shadow:none;border:2px solid rgba(255,255,255,.12)}
.note{font-size:.84rem;color:#9aa0c8;min-height:1.3em}
.banner{position:absolute;inset:0;z-index:3;display:grid;place-content:center;justify-items:center;text-align:center;background:rgba(15,18,51,.82);padding:16px;animation:fade .2s}
.stamp{font-family:var(--disp);font-size:clamp(3rem,9vw,5.5rem);line-height:1;color:var(--yellow);transform:rotate(-8deg);padding:.05em .35em;border:6px solid var(--yellow);border-radius:14px;animation:stamp .35s cubic-bezier(.2,1.6,.4,1)}
.stamp.unsold{color:#c9cdf2;border-color:#c9cdf2}
.banner small{display:block;font-weight:700;font-size:1.05rem;color:#e6e8ff;margin-top:18px;max-width:30ch}
@keyframes stamp{from{transform:rotate(-8deg) scale(2.2);opacity:0}}
@keyframes fade{from{opacity:0}}

.bench-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:18px 4px 10px}
.bench-h h3{margin:0;font-family:var(--disp);font-weight:400;font-size:1.15rem}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:border-color .15s}
.tile:hover{border-color:var(--muted)}
.tile.me{border-color:var(--blue)}
.tile.lead{border-color:var(--yellow);box-shadow:0 0 0 3px color-mix(in srgb,var(--yellow) 40%,transparent)}
.tile-h{display:flex;align-items:center;gap:8px}
.tnw{flex:1;min-width:0}
.tn{display:block;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl{display:block;font-size:.72rem;color:var(--muted);font-weight:700}
.tag{font-size:.66rem;font-weight:800;border-radius:6px;padding:.15em .45em;background:var(--panel2);color:var(--muted);flex-shrink:0}
.tag.you{background:var(--blue);color:#fff}
.tm{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted)}
.tm b{color:var(--ink);font-weight:800}
.budget{height:6px;border-radius:99px;background:var(--panel2);overflow:hidden}
.budget div{height:100%;background:var(--green);border-radius:99px}
.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.slot{aspect-ratio:3/4;border-radius:7px;background:var(--panel2);border:2px dashed var(--line);display:grid;place-items:center;font-size:.72rem;font-weight:800;color:#fff;overflow:hidden}
.slot.f{border:none;background:var(--rc)}
.slot b{font-weight:800}
.tap{display:none}

/* feed / chat */
.chat{background:var(--panel);border:2px solid var(--line);border-radius:24px;display:flex;flex-direction:column;height:min(640px,calc(100vh - 120px));min-height:300px;position:sticky;top:16px}
@media(max-width:940px){.chat{position:static;height:340px}}
.chat-h{padding:14px 16px;font-family:var(--disp);font-size:1rem;display:flex;justify-content:space-between;align-items:center}
.feed{flex:1;overflow-y:auto;padding:0 10px 10px;font-size:.88rem}
.feed p{margin:0;padding:.4em .6em;border-radius:10px;word-wrap:break-word}
.feed .sys{color:var(--muted)}
.feed .sys.lot{color:var(--ink);font-weight:800;margin-top:6px;border-top:2px solid var(--line);border-radius:0;padding-top:.7em}
.feed .sys.sold{background:color-mix(in srgb,var(--yellow) 22%,transparent);color:var(--ink);font-weight:700}
.feed .n1{color:var(--orange);font-weight:800}.feed .n2{color:var(--blue);font-weight:800}
.chat-f{display:flex;gap:6px;padding:10px;border-top:2px solid var(--line)}
.chat-f input{flex:1}
.chat-f button{box-shadow:none}

/* card */
.card{--rc:var(--common);width:150px;border-radius:18px;padding:4px;background:var(--rc);flex-shrink:0}
.card.xl{width:min(220px,46vw)}
.ci{background:#fff;color:#161a3d;border-radius:14px;padding:10px;text-align:center}
.ct{display:flex;justify-content:space-between;align-items:center}
.ovr{font-family:var(--disp);font-size:1.7rem;line-height:1;color:var(--rc)}
.xl .ovr{font-size:2.3rem}
.pos{font-weight:800;font-size:.72rem;background:#161a3d;color:#fff;border-radius:6px;padding:.2em .5em}
.pic{border-radius:12px;margin:8px 0;background:linear-gradient(160deg,color-mix(in srgb,var(--c1) 22%,#fff),#fff);aspect-ratio:1/1;display:grid;place-items:center}
.pic svg{width:80%;height:80%}
.cn{font-weight:800;font-size:.9rem;line-height:1.15}
.xl .cn{font-size:1.1rem}
.sc{font-size:.74rem;color:#5c6386;font-weight:700}
.rl{margin-top:8px;font-weight:800;font-size:.72rem;color:#fff;background:var(--rc);border-radius:7px;padding:.2em 0}
.paid{font-size:.72rem;color:#5c6386;font-weight:700}
.r-common{--rc:var(--common)}.r-rare{--rc:var(--rare)}.r-epic{--rc:var(--epic)}.r-legendary{--rc:var(--legendary)}.r-mythic{--rc:var(--mythic)}
.card.r-mythic,.slot.f.r-mythic{background:linear-gradient(120deg,#ff3d7f,#ffc93c,#3bd1ff,#9a4de6,#ff3d7f);background-size:300% 300%;animation:holo 3s linear infinite}
.r-mythic .rl{background:linear-gradient(90deg,#ff3d7f,#9a4de6)}
@keyframes holo{to{background-position:300% 50%}}
.reveal{animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.5) rotate(-14deg);opacity:0}}

/* lobby / results */
.lobby{text-align:center}
.lobby h2{color:var(--ink)}
.code{font-family:var(--disp);font-size:clamp(3.2rem,12vw,5rem);letter-spacing:.12em;color:var(--navy);background:var(--yellow);border-radius:20px;padding:.05em .3em;margin:6px auto;display:inline-block}
.plist{display:flex;flex-direction:column;gap:8px;margin:14px 0;text-align:left}
.plist>div{background:var(--panel2);border-radius:14px;padding:.6em .8em;font-weight:700}
.plist .pp{display:flex;align-items:center;gap:10px}
.results{min-width:0}
.results h1{font-family:var(--disp);font-weight:400;font-size:clamp(2rem,5vw,2.8rem);margin:4px 0 10px}
.earned{display:inline-block;background:var(--yellow);color:#1b1e4b;border-radius:12px;padding:.4em .9em;font-weight:800;margin-bottom:8px}
.rank{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:14px;margin:12px 0}
.rank.first{border-color:var(--yellow);box-shadow:0 0 0 3px color-mix(in srgb,var(--yellow) 35%,transparent)}
.rank-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
.rank-h .who2{display:flex;align-items:center;gap:10px}
.rank-h .pl{font-family:var(--disp);font-size:1.6rem;color:var(--blue)}
.rank-h .sc2{font-family:var(--disp);font-size:1.8rem}
.cards{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.cards .card{width:118px}
.cards .ovr{font-size:1.3rem}
.bonus{color:var(--muted);font-size:.86rem;margin-top:6px}

/* avatar + shop */
.avbox{width:var(--sz);height:var(--sz);display:inline-block;border-radius:26%;flex-shrink:0;padding:0;line-height:0}
.avbox svg{width:100%;height:100%;display:block;border-radius:22%}
.fr-silver,.fr-gold,.fr-fire,.fr-holo{padding:3px}
.fr-silver{background:linear-gradient(135deg,#eef1f5,#9aa3b0)}.fr-gold{background:linear-gradient(135deg,#fff1a8,#d49a00)}
.fr-fire{background:linear-gradient(135deg,#ffd23f,#ff3d1a)}
.fr-holo{background:linear-gradient(120deg,#ff3d7f,#ffd23f,#3bd1ff,#b04dff,#ff3d7f);background-size:300% 300%;animation:holo 3s linear infinite}
.shop{display:grid;grid-template-columns:310px minmax(0,1fr);gap:16px}
@media(max-width:780px){.shop{grid-template-columns:1fr}}
.shop-l{align-items:center;text-align:center;background:var(--navy);border-color:var(--navy);color:#fff;position:relative;overflow:hidden;--rc:var(--yellow)}
.shop-l .hint{color:#c9cdf2}
.shop-l .ttl{color:#c9cdf2}
.shop-l .g{background:transparent;color:#fff;border-color:rgba(255,255,255,.3);box-shadow:none}
.stage-av{padding:14px;position:relative}
.earn{background:rgba(255,255,255,.08);border-radius:14px;padding:12px;font-size:.82rem;color:#c9cdf2;display:flex;flex-direction:column;gap:3px;width:100%;position:relative}
.earn b{color:#fff}
.cats{display:flex;gap:6px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.item{background:var(--panel2);border:2px solid var(--line);border-radius:18px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink);font-weight:700;box-shadow:none}
.item:hover{border-color:var(--muted)}
.item.on{border-color:var(--yellow);box-shadow:0 0 0 3px color-mix(in srgb,var(--yellow) 40%,transparent)}
.ip{width:84px;height:84px;display:grid;place-items:center}.ip svg{width:100%;height:100%;border-radius:20px}
.tprev{font-family:var(--disp);font-size:.9rem;text-align:center;color:var(--blue)}
.in{font-size:.84rem;font-weight:800}.pr{font-size:.76rem;color:var(--muted)}


/* settings */
.setup{max-width:680px;margin:0 auto}
.setup-h{font-family:var(--disp);font-weight:400;font-size:1.8rem;margin:0}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:520px){.modes{grid-template-columns:1fr}}
.modecard{text-align:left;background:var(--panel2);color:var(--ink);border:2px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px;box-shadow:none;font-weight:500}
.modecard b{font-family:var(--disp);font-weight:400;font-size:1.1rem}
.modecard span{font-size:.86rem;color:var(--muted)}
.modecard.on{border-color:var(--yellow);background:color-mix(in srgb,var(--yellow) 16%,var(--panel));box-shadow:0 0 0 3px color-mix(in srgb,var(--yellow) 35%,transparent)}
.modecard:disabled,.chip:disabled{opacity:1;cursor:default}
.setrow{display:flex;flex-direction:column;gap:6px}
.setlbl{font-weight:800;font-size:.9rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel2);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:.45em .95em;box-shadow:none;font-size:.9rem}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.lobbycfg{text-align:left;display:flex;flex-direction:column;gap:12px;margin:6px 0 16px;padding-top:14px;border-top:2px solid var(--line)}
.finalline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 8px}
/* match */
.matchview{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.msb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;background:var(--board);color:#fff;border-radius:22px;padding:12px 16px}
.mteam{display:flex;align-items:center;gap:10px;min-width:0}.mteam.r{justify-content:flex-end;text-align:right}
.mteam b{display:block;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mteam span{font-size:.78rem;color:#9aa0c8;font-weight:700}
.mscore{display:flex;align-items:center;gap:14px;font-family:var(--disp);font-size:clamp(2rem,6vw,3rem);line-height:1}
.mclock{font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;font-size:.95rem;background:rgba(255,255,255,.1);border-radius:10px;padding:.3em .7em;min-width:5.5em;text-align:center}
@media(max-width:560px){.mteam .avbox{display:none}.msb{padding:10px}}
.courtwrap{position:relative;border-radius:22px;overflow:hidden;background:#2f5fd0}
#court{display:block;width:100%;height:auto}
.mover{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:14px;text-align:center;background:rgba(15,18,51,.7);color:#fff}
.mover small{font-weight:800;font-size:1.1rem}

const PREFIX="spikeauction-v1-";
const ICE={config:{iceCandidatePoolSize:4,iceServers:[
  {urls:["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302","stun:stun2.l.google.com:19302","stun:stun.cloudflare.com:3478"]},

function netPill(){return netStatus==="ok"?`<span id="netpill" class="pill"><span class="dot"></span>Room ${esc(code)}${mode==="guest"?pingTxt(roomPing):""}</span>`:`<span id="netpill" class="pill warn"><span class="dot"></span>Reconnecting…</span>`;}
function makeNet(code,isHost){
  return new Promise((resolve,reject)=>{
    let list={},myId=null,conns={},hostConn=null,done=false,pend=false,dead=false,tries=0;const subs=[];
    const ok=v=>{if(!done){done=true;resolve(v);}}, bad=e=>{if(!done){done=true;dead=true;try{peer.destroy();}catch(x){}reject(e);}};
    const snap=()=>({peers:Object.entries(list).map(([id,p])=>({peer:id,presence:p||{},isMe:id===myId,sameTab:id===myId}))});
    const emit=()=>{if(pend)return;pend=true;setTimeout(()=>{pend=false;const sn=snap();subs.forEach(f=>f(sn));},0);};
    const broadcast=()=>{const m={t:"all",l:list};Object.values(conns).forEach(c=>{if(c.open){try{c.send(m);}catch(e){}}});};
    // only the entries that changed go out, batched into one message every ~30ms
    let dirty=new Set(),flushT=0;
    const flushUpd=()=>{flushT=0;if(!dirty.size)return;const u={};dirty.forEach(id=>{u[id]=list[id]===undefined?null:list[id];});dirty=new Set();const m={t:"u",u};Object.values(conns).forEach(c=>{if(c.open){try{c.send(m);}catch(e){}}});};
    const queueUpd=id=>{dirty.add(id);if(!flushT)flushT=setTimeout(flushUpd,30);};
    let mineT=0;const sendMineNow=()=>{mineT=0;if(hostConn&&hostConn.open){try{hostConn.send({t:"p",p:list[myId]||{}});}catch(e){}}};
    const sendMine=()=>{if(!mineT)mineT=setTimeout(sendMineNow,25);};
    const api={
      presence(patch){const p=Object.assign({},list[myId]||{});for(const k in patch){if(patch[k]===null)delete p[k];else p[k]=patch[k];}
        list[myId]=p;if(isHost)queueUpd(myId);else sendMine();emit();return Promise.resolve();},
      onPeers(fn){subs.push(fn);setTimeout(()=>fn(snap()),0);return()=>{};},
      peers(){return snap().peers;},
      hostConnected(){return isHost||!!(hostConn&&hostConn.open);},
      destroy(){dead=true;try{peer.destroy();}catch(e){}}
    };
    const peer=isHost?new Peer(PREFIX+code,ICE):new Peer(ICE);
    peer.on("error",e=>{bad(e);});
    peer.on("disconnected",()=>{if(!dead)setTimeout(()=>{if(!dead&&peer.disconnected){try{peer.reconnect();}catch(e){}}},1500);});
    setTimeout(()=>bad(new Error("timeout")),20000);
    if(isHost){
      peer.on("open",id=>{if(!myId){myId=id;list[id]={};}ok(api);});
      peer.on("connection",c=>{
        c.on("open",()=>{const old=conns[c.peer];conns[c.peer]=c;if(old&&old!==c){try{old.close();}catch(e){}}list[c.peer]=list[c.peer]||{};broadcast();emit();});
        c.on("data",d=>{if(conns[c.peer]!==c)return;if(d&&d.t==="p"&&d.p&&typeof d.p==="object"&&JSON.stringify(d.p).length<4000){list[c.peer]=d.p;queueUpd(c.peer);emit();}
          else if(d&&d.t==="pi"){try{c.send({t:"po",ts:d.ts});}catch(e){}}});
        const gone=()=>{if(conns[c.peer]!==c)return;delete conns[c.peer];delete list[c.peer];broadcast();emit();};
        c.on("close",gone);c.on("error",gone);
      });
      // drop guests whose connection silently died
      setInterval(()=>{if(dead)return;Object.entries(conns).forEach(([id,c])=>{const pc=c.peerConnection;if(pc&&(pc.connectionState==="failed"||pc.iceConnectionState==="failed")){delete conns[id];delete list[id];broadcast();emit();}});},3000);
    }else{
      const connect=()=>{
        if(dead)return;
        const hc=peer.connect(PREFIX+code,{reliable:true,serialization:"json"});hostConn=hc;
        hc.on("open",()=>{tries=0;setNet("ok");sendMineNow();ok(api);if(!hc._pi)hc._pi=setInterval(()=>{if(hc.open&&hc===hostConn){try{hc.send({t:"pi",ts:performance.now()});}catch(e){}}else clearInterval(hc._pi);},3000);});
        hc.on("data",d=>{if(hc!==hostConn)return;if(d&&d.t==="all"&&d.l&&typeof d.l==="object"){const mine=list[myId];list=d.l;list[myId]=mine;emit();}
          else if(d&&d.t==="u"&&d.u&&typeof d.u==="object"){for(const id in d.u){if(id===myId)continue;if(d.u[id]===null)delete list[id];else list[id]=d.u[id];}emit();}
          else if(d&&d.t==="po"){roomPing=Math.round(performance.now()-d.ts);const el=$("netpill");if(el&&netStatus==="ok")el.outerHTML=netPill();}});
        const lost=()=>{if(hc!==hostConn||dead||!done)return;list={[myId]:list[myId]};emit();setNet("lost");
          if(tries++<15)setTimeout(connect,2000);};
        hc.on("close",lost);hc.on("error",lost);
      };
      peer.on("open",id=>{if(!myId){myId=id;list[id]={};}if(!hostConn)connect();});
      peer.on("error",e=>{if(done&&e.type==="peer-unavailable"&&!dead){setNet("lost");if(tries++<15)setTimeout(connect,2000);}});
    }
  });
}

async function createRoom(){

  for(let tries=0;tries<4&&!ROOM;tries++){
    code=Array.from({length:4},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ"[Math.floor(Math.random()*24)]).join("");

/* ---------- engine (solo + host) ---------- */
function full(s){return s.r.length>=ROSTER;}
function maxPay(s){return s.b-MIN_SLOT*(ROSTER-s.r.length-1);}
function minNext(){return G.ld<0?G.pr:G.pr+inc(G.pr);}
function ev(t){G.ev.push([++evId,t]);if(G.ev.length>6)G.ev.shift();}
function addBot(){const k=G.seats.filter(s=>s.bot).length;const b=BOTS[k%4];G.seats.push({id:"bot"+k,n:b.name,av:randomBotAv(k),bot:true,fav:b.fav,st:+(0.9+Math.random()*0.25).toFixed(2),b:START,r:[],pass:false});}
function startMatch(){
  G.cfg=cleanCfg(G.cfg);
  if(mode==="solo"){const want=G.cfg.mode==="quick"?2:4;G.seats=G.seats.filter(s=>!s.bot);while(G.seats.length<want)addBot();}
  if(mode==="solo"){const votes=G.seats.map(s=>s.bot?MAPS[Math.floor(Math.random()*MAPS.length)].id:prof.mapVote),t=tallyMap(votes);G.map=t.id;
    setTimeout(()=>toast(`🗳️ Map vote: <b>${mapOf(t.id).e} ${esc(mapOf(t.id).n)}</b> wins with ${t.n} vote${t.n>1?"s":""}`),300);}
  else if(mode==="host"){const v=G.seats.map(s=>(G.votes||{})[s.id]).filter(Boolean),t=tallyMap(v.length?v:["classic"]);G.map=t.id;ev(`Map: ${mapOf(t.id).n} (${t.n} vote${t.n>1?"s":""})`);}
  G.seats.forEach(s=>{if(s.bot)s.tac=randTac();else if(s.id==="host")s.tac=prof.tac;else if(!TACTICS[s.tac])s.tac="balanced";});
  if(G.cfg.mode==="quick")return startQuick();
  START=G.cfg.coins;G.match=null;G.tour=null;
  G.seats.forEach(s=>{s.b=START;s.r=[];s.pass=false;});
  pool=shuffle(BASE_IDS.slice());G.lotNo=0;G.ev=[];G.mid=Math.floor(Math.random()*1e9);ev("Auction started. Good luck!");nextLot();
}
function aiWill(s,c){
  let v=Math.pow(Math.max(c.power-55,5),2)*0.33*(START/1000)*s.st*(0.85+Math.random()*0.3);
  const same=s.r.filter(x=>ch(x[0]).pos===c.pos).length;
  if(c.pos==="S"||c.pos==="L")v*=same===0?1.25:0.4;else if(same>=2)v*=0.6;
  if(c.pos===s.fav)v*=1.15;
  return Math.round(Math.min(v,s.b/Math.max(ROSTER-s.r.length,1)*2.6));
}
function nextLot(){
  if(G.seats.every(s=>full(s)||s.gone))return endMatch();
  if(!pool.length){G.seats.forEach(s=>{while(!full(s))s.r.push([-1,0]);});return endMatch();}
  G.lot=pool.pop();G.left=pool.length;G.lotNo++;const c=ch(G.lot);
  G.pr=RAR[rarC(c)].open;G.ld=-1;G.t=G.cfg.clock;G.phase="lot";G.ban="";
  G.seats.forEach(s=>s.pass=full(s)||!!s.gone);
  G.sp=G.seats.filter(s=>!s.bot).every(full)?3:1;
  will={};G.seats.forEach((s,i)=>{if(s.bot)will[i]=full(s)?0:aiWill(s,c);});botWait=1800+Math.random()*1500;
  ev(`Lot ${G.lotNo}: ${c.name} (${RAR[rarC(c)].label}) opens at ${G.pr}`);
  publish(true);render();
}
function placeBid(si,amt){
  const s=G.seats[si];if(!s||s.gone||G.phase!=="lot"||full(s)||G.ld===si)return false;
  amt=Math.floor(Number(amt));if(!Number.isFinite(amt)||amt<minNext()||amt>maxPay(s))return false;
  if(si===mySeat())sfx("bid");
  G.pr=amt;G.ld=si;G.t=Math.max(G.t,Math.min(4500,G.cfg.clock*.6));botWait=1200+Math.random()*1600;s.pass=false;ev(`${s.n} bids ${amt}`);publish(true);return true;
}
function botsWant(){const n=minNext();return G.seats.some((s,i)=>s.bot&&G.ld!==i&&!full(s)&&n<=will[i]&&n<=maxPay(s));}
function resolve(){
  const c=ch(G.lot);
  if(G.ld>=0){const s=G.seats[G.ld];s.b-=G.pr;s.r.push([G.lot,G.pr]);G.ban=`SOLD!|${c.name} goes to ${s.n} for ${G.pr}`;ev(`SOLD: ${c.name} to ${s.n} for ${G.pr}`);}
  else{G.ban=`Unsold|Nobody bid on ${c.name}`;ev(`No bids on ${c.name}`);}
  G.phase="sold";pauseMs=G.sp>1?600:1500;publish(true);render();
}
function tick(){
  if(!G)return;
  if(G.phase==="sold"){pauseMs-=100;if(pauseMs<=0)nextLot();}
  else if(G.phase==="lot"){
    G.t-=100*G.sp;botWait-=100*G.sp;const n=minNext();
    G.seats.forEach((s,i)=>{
      if(!s.bot||G.ld===i||full(s))return;
      const w=will[i];
      if(botWait<=0&&n<=w&&n<=maxPay(s)&&Math.random()<0.07*G.sp){let a=n;if(w-n>120&&Math.random()<0.25)a=Math.min(n+inc(n)*3,w,maxPay(s));placeBid(i,a);}
    });
    const humansDone=G.seats.every((s,i)=>s.bot||s.pass||full(s)||G.ld===i);
    if(humansDone&&!botsWant())G.t=Math.min(G.t,G.ld<0?300:1200);
    if(G.t<=0)resolve();
  }
  if(G.phase==="draft"&&Math.random()<.05)checkDraftDone();
  publish(false);syncEv();live();
}
function endMatch(){G.ban="";ev("Auction over!");
  if(G.cfg.mode==="match"&&G.seats.length>=2){const top=G.seats.map((s,i)=>({i,sc:teamScore(s).total})).sort((a,b)=>b.sc-a.sc);
    const msg=makeFinals(top.map(x=>x.i),G.cfg.dur);G.phase="match";ev(msg);}
  else G.phase="end";publish(true);render();
  const me=G.seats.find(s=>s.id==="host");try{const b=parseFloat(localStorage.getItem("spikeBest")||"0");const sc=teamScore(me).total;if(sc>b)localStorage.setItem("spikeBest",sc);}catch(e){}}
function publish(force){
  if(mode!=="host"||!ROOM)return;const now=Date.now();
  if(!force&&now-lastPub<200)return;lastPub=now;
  while(JSON.stringify(G).length>3300&&G.ev.length>1)G.ev.shift();
  ROOM.presence({rm:code,host:1,nm:myName,g:G}).catch(()=>{});
}

/* ---------- room traffic ---------- */
function onPeers(peers){
  if(!mode||mode==="solo")return;
  const here=peers.filter(p=>p.presence&&p.presence.rm===code);
  // chat
  here.forEach(p=>{const m=p.presence.msg;if(m&&typeof m.x==="string"){const k=p.peer+":"+m.s;if(!seenMsg.has(k)){seenMsg.add(k);addChat(clean(p.presence.nm,16)||"Someone",clean(m.x,140),p.isMe&&p.sameTab);}}});
  if(mode==="host"){
    const others=here.filter(p=>!p.sameTab&&!p.presence.host);
    if(G.phase==="lobby"){
      G.seats=G.seats.filter(s=>s.id==="host"||others.some(p=>p.peer===s.id));
      others.forEach(p=>{const s=G.seats.find(s=>s.id===p.peer);const n=clean(p.presence.nm,16)||"Player";
        if(p.presence.vote&&MAPS.some(m=>m.id===p.presence.vote)&&(G.votes||{})[p.peer]!==p.presence.vote)G.votes=Object.assign({},G.votes,{[p.peer]:p.presence.vote});
        if(s){s.n=n;s.av=cleanAv(p.presence.av);}else if(G.seats.length<4){G.seats.push(humanSeat(p.peer,n,p.presence.av));sysChat(`${n} joined`);}});
      publish(true);render();
    }else{
      G.seats.forEach(s=>{if(s.gone&&!s.bot&&others.some(p=>p.peer===s.id)){s.gone=false;if(s.n.endsWith(" (left)"))s.n=s.n.slice(0,-7);sysChat(`${s.n} reconnected`);publish(true);}});
      G.seats.forEach((s,i)=>{if(!s.bot&&!s.gone&&s.id!=="host"&&!others.some(p=>p.peer===s.id)){s.gone=true;s.goneAt=Date.now();s.pass=true;if(G.ld===i&&G.phase==="lot"){G.ld=-1;G.pr=RAR[rarityOf(ch(G.lot).power)].open;}sysChat(`${s.n} left the room`);}});
      others.forEach(p=>{
        const si=G.seats.findIndex(s=>s.id===p.peer&&!s.bot);if(si<0)return;
        const b=p.presence.bid;
        if(b&&typeof b==="object"&&b.s>(lastSeq[p.peer]||0)){lastSeq[p.peer]=b.s;if(b.l===G.lotNo&&b.m===G.mid)placeBid(si,b.a);}
        if(p.presence.pass===G.mid+":"+G.lotNo&&G.ld!==si)G.seats[si].pass=true;
        const tc=p.presence.tac;if(typeof tc==="string"&&TACTICS[tc]&&G.seats[si].tac!==tc){G.seats[si].tac=tc;publish(true);}
        const d=p.presence.draft;
        if(G.phase==="draft"&&d&&d.m===G.mid&&!G.seats[si].done&&validRoster(d.r)){const F=Array.isArray(d.full)&&d.full.length===ROSTER?d.full:null;
          G.seats[si].r=d.r.map((i,k)=>F&&Array.isArray(F[k])?[i,-1,Math.min(MAX_LV,Math.max(0,F[k][0]|0)),Math.min(6,Math.max(0,F[k][1]|0))]:[i,-1]);G.seats[si].done=true;publish(true);render();}
      });
      checkDraftDone();
    }
  }else if(mode==="guest"){
    const h=here.find(p=>p.presence.host&&p.presence.g);
    if(h){hostSeenAt=Date.now();hostGone=false;const g=h.presence.g;
      if(!G||g!==G._src){G=Object.assign({},g,{_src:g,recv:Date.now()});
        syncEv();render();}}
  }
}
function guestCheck(){
  if(mode!=="guest"||!ROOM)return;
  const hostHere=ROOM.peers().some(p=>p.presence&&p.presence.rm===code&&p.presence.host);
  if(hostHere){hostSeenAt=Date.now();if(hostGone){hostGone=false;shellKey="";render();}return;}
  const limit=G?25000:8000;
  if(!hostGone&&Date.now()-hostSeenAt>limit){hostGone=true;render();}
}

 {n:"World Stage",t:c=>/\((Brazil|Russia|Argentina)\)/.test(c.name)},{n:"Legends",t:c=>!!(c.ult||c.deity||c.owl||c.sky||c.mon)}];
const baseName=c=>c.name.replace(/ \(.*\)$/,"");
const NOSCHOOL=new Set(["Rival Club","Elite Academy","Pro League","Free Agent"]);
// returns per-card match power bonus and the rating bonus list
function chemOf(cards){
  const per=cards.map(()=>0),list=[];
  const by={};cards.forEach((c,k)=>{if(!NOSCHOOL.has(c.school))(by[c.school]=by[c.school]||[]).push(k);});
  Object.entries(by).forEach(([sc,ks])=>{if(ks.length>=2){list.push([`${sc} x${ks.length}`,(ks.length-1)*1.5]);ks.forEach(k=>per[k]+=ks.length>=4?2:1);}});
  DUOS.forEach(([a,b,n])=>{const A=cards.map((c,k)=>baseName(c)===a?k:-1).filter(k=>k>=0),B=cards.map((c,k)=>baseName(c)===b?k:-1).filter(k=>k>=0);
    if(A.length&&B.length){list.push([`💞 ${n}`,2]);A.concat(B).forEach(k=>per[k]+=2);}});
  CHEM_GROUPS.forEach(g=>{const ks=cards.map((c,k)=>g.t(c)?k:-1).filter(k=>k>=0);if(ks.length>=2){list.push([`✦ ${g.n} x${ks.length}`,(ks.length-1)*1.5]);ks.forEach(k=>per[k]+=ks.length>=4?2:1);}});
  return {per:per.map(v=>Math.min(5,v)),list};}
// stage buffs: a context string like "map:karasuno|mode:gauntlet|feat:Nekoma"
const PRO_SCHOOLS=new Set(["MSBY Black Jackals","Schweiden Adlers","Sendai Frogs","Argentina","Russia","Beach Brazil"]);
const TOWER_FEAT=["Karasuno","Nekoma","Fukurodani","Aoba Johsai","Shiratorizawa","Inarizaki","Itachiyama","Kamomedai"];
const towerFeat=()=>TOWER_FEAT[weekId()%TOWER_FEAT.length];
function stageRules(ctx){const r=[];if(!ctx)return r;const P={};String(ctx).split("|").forEach(x=>{const [k,v]=x.split(":");if(k)P[k]=v;});
  const school=s=>c=>c.school===s;
  ({karasuno:()=>r.push({n:"Karasuno home court",b:3,t:school("Karasuno")}),nekoma:()=>r.push({n:"Nekoma home court",b:3,t:school("Nekoma")}),
    seijoh:()=>r.push({n:"Seijoh home court",b:3,t:school("Aoba Johsai")}),arena:()=>r.push({n:"Pros love the big stage",b:2,t:c=>/\(Timeskip\)/.test(c.name)||PRO_SCHOOLS.has(c.school)}),
    night:()=>r.push({n:"Evolved cards shine at night",b:3,t:c=>!!c.evolved}),sakura:()=>r.push({n:"Inarizaki's fox shrine",b:3,t:school("Inarizaki")}),
    haunted:()=>r.push({n:"Haunted Court",b:4,t:c=>!!c.spooky})}[P.map]||(()=>0))();
  if(P.mode==="gauntlet")r.push({n:"Owl Gauntlet: every Bokuto",b:4,t:c=>baseName(c)==="Bokuto Kotaro"});
  if(P.mode==="hboss")r.push({n:"Halloween boss",b:4,t:c=>!!c.spooky});
  if(P.feat)r.push({n:`Tower spotlight: ${P.feat}`,b:3,t:school(P.feat)});
  return r;}
const stageBonus=(c,rules)=>rules.reduce((a,r)=>a+(r.t(c)?r.b:0),0);
function matchCtx(){if(!G)return "";const m="map:"+(G.map||"classic");
  if(mode==="gauntlet")return m+"|mode:gauntlet";if(mode==="hboss")return m+"|mode:hboss";if(mode==="tower")return m+"|feat:"+towerFeat();return m;}
const buffText=ctx=>stageRules(ctx).map(r=>`${r.n} +${r.b}`).join(" · ");

function teamScore(s){
  const r=s.r.map(cardLv);if(!r.length)return {total:0,avg:0,bonus:[]};
  const avg=(r.reduce((a,c)=>a+c.power,0)+50*(ROSTER-r.length))/ROSTER;const bonus=[];
  if(r.some(c=>c.pos==="S"))bonus.push(["setter",3]);
  if(r.some(c=>c.pos==="L"))bonus.push(["libero",2]);
  if(r.some(c=>c.pos==="MB"))bonus.push(["middle blocker",1]);
  if(r.filter(c=>c.pos==="OH"||c.pos==="OP").length>=2)bonus.push(["two attackers",1]);
  chemOf(r).list.forEach(x=>bonus.push(x));
  const rules=stageRules(s.ctx);if(rules.length){const sb=r.reduce((a,c)=>a+stageBonus(c,rules),0)/ROSTER;if(sb)bonus.push(["🏟️ stage buffs",Math.round(sb*10)/10]);}
  const total=avg+bonus.reduce((a,b)=>a+b[1],0);
  return {total:Math.round(total*10)/10,avg:Math.round(avg*10)/10,bonus};
}

/* ---------- game settings ---------- */
const CFG_DEF={mode:"normal",dur:60,coins:2000,clock:8000,draft:"roll",skips:4,fmt:"final",chaos:0};
const CFG_OPTS={fmt:[["final","Top 2 final"],["bracket","Tournament bracket"]],draft:[["roll","Roll for cards"],["random","Random lineup"],["main","Main-team tournament"]],skips:[[2,"2"],[4,"4"],[8,"8"]],dur:[[30,"30 sec"],[60,"1 min"],[120,"2 min"],[180,"3 min"]],coins:[[1000,"1,000"],[2000,"2,000"],[3000,"3,000"],[5000,"5,000"]],clock:[[5000,"5 sec"],[8000,"8 sec"],[12000,"12 sec"]],chaos:[[0,"Off"],[1,"🌀 On"]]};
function cleanCfg(c){const o={...CFG_DEF};if(c&&typeof c==="object"){if(["normal","match","quick"].includes(c.mode))o.mode=c.mode;
  for(const k of ["dur","coins","clock","draft","fmt","chaos"])if(CFG_OPTS[k].some(x=>x[0]===c[k]))o[k]=c[k];
  if(Number.isInteger(c.skips))o.skips=Math.max(0,Math.min(20,c.skips));}return o;}
let myCfg=CFG_DEF;try{myCfg=cleanCfg(JSON.parse(localStorage.getItem("spikeCfg")||"null"));}catch(e){}
function cfgHTML(cfg,edit){
  const dis=edit?"":"disabled";
  const chips=(k,label)=>`<div class="setrow"><span class="setlbl">${label}</span><div class="chips">${CFG_OPTS[k].map(([v,t])=>`<button class="chip ${cfg[k]===v?"on":""}" data-cfg="${k}" data-v="${v}" ${dis}>${t}</button>`).join("")}</div></div>`;
  const q=cfg.mode==="quick";
  return `<div class="modes">
    <button class="modecard ${cfg.mode==="normal"?"on":""}" data-cfg="mode" data-v="normal" ${dis}><b>Normal auction</b><span>Highest team rating when the rosters fill up wins.</span></button>
    <button class="modecard ${cfg.mode==="match"?"on":""}" data-cfg="mode" data-v="match" ${dis}><b>Match auction</b><span>The two best teams play a volleyball match. The match winner takes it all.</span></button>
    <button class="modecard ${q?"on":""}" data-cfg="mode" data-v="quick" ${dis}><b>Quick match</b><span>No auction. Roll for players or get a random team, then play a match.</span></button>
  </div>
  ${q?chips("draft","Lineup"):""}
  ${q&&cfg.draft==="roll"?`<div class="setrow"><span class="setlbl">Skips per draft</span><div class="stepper"><button data-skip="-1" ${dis} aria-label="Fewer skips">−</button><input id="skipIn" type="number" min="0" max="20" value="${cfg.skips}" ${dis} aria-label="Skips per draft"><button data-skip="1" ${dis} aria-label="More skips">+</button></div></div>`:""}
  ${cfg.mode!=="normal"?chips("dur","Match length"):""}
  ${cfg.mode!=="normal"?chips("fmt","Final format (bracket needs 3–4 teams)"):""}
  ${cfg.mode!=="normal"?chips("chaos","🌀 Chaos mode: 3 random modifiers in every match"):""}
  ${!q?chips("coins","Starting coins"):""}
  ${!q?chips("clock","Bid clock"):""}`;

function rankInfo(rp){rp=Math.max(0,rp|0);const k=tierIdx(rp),t=TIERS[k];
  if(k===TIERS.length-1)return {name:"Legend",k,d:0,lo:t[1],hi:null,color:t[2],key:"L"};
  const lo=t[1],hi=TIERS[k+1][1],step=(hi-lo)/3,d=Math.min(3,Math.floor((rp-lo)/step)+1);
  return {name:`${t[0]} ${d}`,k,d,lo:Math.round(lo+(d-1)*step),hi:Math.round(lo+d*step),color:t[2],key:k+"-"+d};}
function rankBadge(rp){const r=rankInfo(rp);return `<span class="rankb" style="--tc:${r.color}">${r.name} <small>${Math.max(0,rp|0)}</small></span>`;}

    const alt=pool.filter(i=>!used.includes(i)&&CHARS[i][2]===pos);const a=c.length?c:alt;return a[Math.floor(Math.random()*a.length)];};

function mmCleanup(m){m=m||MM;if(!m)return;clearInterval(m.tick);clearTimeout(m.timer);clearInterval(m.rescan);
  [m.searcher,m.slot].forEach(p=>{if(p){try{p.destroy();}catch(e){}}});m.searcher=m.slot=null;}
function newPeer(id){return new Promise(res=>{let done=false;const p=id?new Peer(id,ICE):new Peer(ICE);
  const fin=v=>{if(!done){done=true;res(v);}};
  p.on("open",()=>fin(p));p.on("error",e=>{if(!done){try{p.destroy();}catch(x){}fin(null);}});setTimeout(()=>{if(!done){try{p.destroy();}catch(x){}fin(null);}},8000);});}
function tryConnect(peer,id){return new Promise(res=>{let done=false;const fin=v=>{if(!done){done=true;peer.off&&peer.off("error",onErr);res(v);}};

  c.on("data",d=>{if(!d)return;if(d.t==="mmok"&&Number.isInteger(d.seed)){const o=oppFromPayload(d);fin(o?{opp:o,seed:d.seed,host:false}:null);}else if(d.t==="busy")fin(null);});

function onSlotConnection(c){

}
async function findMatch(){

  if(typeof Peer==="undefined"||navigator.onLine===false){MM=null;return toBot("No internet, so you're playing a bot.");}
  MM={start:Date.now(),matched:false,cancel:false,status:"Looking for players…"};renderRanked();
  MM.tick=setInterval(()=>{const e=$("mmTime");if(e&&MM)e.textContent=Math.floor((Date.now()-MM.start)/1000)+"s";},500);
  const me=MM;
  me.timer=setTimeout(()=>{if(me.cancel||me.matched)return;me.matched=true;mmCleanup(me);toBot("No players found, so you're facing a bot.");},MM_WAIT);
  me.searcher=await newPeer();if(me.cancel){mmCleanup(me);return;}if(me.matched)return;
  if(!me.searcher){me.matched=true;mmCleanup(me);return toBot("Couldn't reach the matchmaking server, so you're playing a bot.");}
  const scan=async upto=>{if(!me.searcher)return null;
      const conns=(await Promise.all(Array.from({length:upto},(_,k)=>tryConnect(me.searcher,MM_PREFIX+k)))).filter(Boolean);
      for(const c of conns){if(me.cancel||me.matched){try{c.close();}catch(e){}continue;}
        me.matched=true;const r=await handshakeAsConnector(c);if(r){conns.forEach(x=>{if(x!==c){try{x.close();}catch(e){}}});setTimeout(()=>mmCleanup(me),2500);return r;}me.matched=false;try{c.close();}catch(e){}}
      return null;};

  for(let k=0;k<MM_SLOTS&&!me.slot;k++){if(me.cancel||me.matched)return;const p=await newPeer(MM_PREFIX+k);if(p){if(me.cancel||me.matched){try{p.destroy();}catch(e){}return;}me.slot=p;me.slotK=k;p.on("connection",onSlotConnection);}}

  clearTimeout(me.timer);me.timer=setTimeout(()=>{if(me.cancel||me.matched)return;me.matched=true;mmCleanup(me);toBot("Nobody else was queuing, so you're facing a bot.");},MM_GRACE);

}

/* ---------- duel requests ---------- */
let DUEL=null;
let duelChaos=false;
function cancelDuel(){if(!DUEL)return;const d=DUEL;DUEL=null;clearTimeout(d.timer);try{d.conn&&d.conn.open&&d.conn.send({t:"cancel"});}catch(e){}
  setTimeout(()=>{try{d.peer.destroy();}catch(e){}},300);setCh("Duel request cancelled.");refreshTeam();}
function requestDuel(user){
  if(!validRoster(prof.main)||DUEL)return;
  if(user.length<3){setCh("Type a username (3–16 letters, numbers or _).");return;}
  if(user===prof.user){setCh("You can't duel yourself!");return;}
  if(typeof Peer==="undefined"||navigator.onLine===false){setCh("You need internet to send duel requests.");return;}
  const me={user,conn:null,tries:0,peer:null,chaos:!!duelChaos};DUEL=me;setCh(`Looking for @${user}…`);refreshTeam();
  const stop=msg=>{if(DUEL!==me)return;DUEL=null;clearTimeout(me.timer);clearTimeout(me.retryT);setTimeout(()=>{try{me.peer&&me.peer.destroy();}catch(e){}},300);setCh(msg);refreshTeam();};
  const offline=`@${user} isn't online right now. They need the game open (it can be in the background).`;
  me.timer=setTimeout(()=>stop(me.conn?`@${user} didn't answer your duel request.`:offline),60000);
  const attempt=()=>{if(DUEL!==me)return;me.tries++;
    if(me.tries>1)setCh(`Still looking for @${user}… (try ${me.tries} of 5)`);
    const c=me.peer.connect(UPREFIX+user,{reliable:true,serialization:"json"});let opened=false;
    const retry=()=>{if(DUEL!==me||me.conn)return;if(me.tries>=5)return stop(offline);clearTimeout(me.retryT);me.retryT=setTimeout(attempt,2500);};
    me.cur=c;me.retry=retry;
    setTimeout(()=>{if(!opened&&me.cur===c){try{c.close();}catch(e){}retry();}},8000);
    c.on("open",()=>{if(DUEL!==me||me.cur!==c)return;opened=true;me.conn=c;clearTimeout(me.timer);me.timer=setTimeout(()=>stop(`@${user} didn't answer your duel request.`),50000);
      c.send({t:"invite",...myRankedPayload(),chaos:me.chaos?1:0});setCh(`Duel request sent to @${user}! Waiting for them to accept…`);sfx("bid");refreshTeam();
      setTimeout(()=>{if(DUEL===me&&!me.seen)setCh(`Sent to @${user}, but their game hasn't shown it yet. If no popup appears for them, they need the newest version of Web Volleyball.`);},6000);});
    c.on("data",d=>{if(DUEL!==me||!d)return;
      if(d.t==="accept"&&Number.isInteger(d.seed)){const o=oppFromPayload(d);if(!o)return stop("Something went wrong with their team. Try again.");
        clearTimeout(me.timer);DUEL=null;chStatus="";startLive({conn:c,peer:me.peer,host:false,opp:{...o,user},seed:d.seed,mySide:0,chaos:me.chaos&&d.chaos!==0});}
      else if(d.t==="decline")stop(`@${user} declined your duel request.`);
      else if(d.t==="busy")stop(`@${user} is already in a duel. Try again in a bit.`);
      else if(d.t==="noteam")stop(`@${user} hasn't set up a main team yet.`);
      else if(d.t==="seen"){me.seen=true;setCh(`@${user} got your duel request! Waiting for them to accept…`);}
      else if(d.t==="oldver")stop(d.who==="them"?`@${user} has a newer version of the game. Download the newest Web Volleyball to duel them.`:`@${user} needs the newest version of Web Volleyball: your team has cards their game doesn't know yet.`);});
    c.on("close",()=>{if(DUEL!==me)return;if(me.conn===c){me.conn=null;me.tries=Math.min(me.tries,3);retry();}});
    c.on("error",()=>{if(DUEL===me&&!opened)retry();});
  };
  const boot=()=>{if(DUEL!==me)return;try{me.peer&&me.peer.destroy();}catch(e){}
    const p=new Peer(ICE);me.peer=p;
    p.on("open",attempt);
    p.on("error",e=>{if(DUEL!==me)return;
      if(e.type==="peer-unavailable"){if(!me.conn)me.retry?me.retry():null;}
      else if(!p.open){if(me.tries<5){me.tries++;setTimeout(boot,2500);}else stop("Couldn't reach the duel server. Check your internet and try again.");}});
  };
  boot();
}

const BW=900,BH=520,BNET=450;
const bHome=(side,k)=>({x:side?BW-290:290,y:k?340:190});
function bKey(e){if(!BEACH||mode!=="beach")return;if(e.code==="Space"||e.key==="Enter"){if(e.target&&e.target.tagName==="INPUT")return;e.preventDefault();bPress();}}
function bPress(){const B=BEACH;if(!B||!B.input)return;const f=B.input;B.input=null;f();}
const bSleep=(B,ms)=>new Promise(r=>{const t0=performance.now();const tick=()=>{if(BEACH!==B)return;if(performance.now()-t0>=ms)r();else requestAnimationFrame(tick);};tick();});
function bAnim(B,o){return new Promise(res=>{o.t=0;o.res=res;B.seg=o;B.ball.vis=true;});}
function bSay(B,t){B.text=t;const e=$("bComm");if(e)e.textContent=t;}
function bBanner(B,t,c){B.banner={t,c:c||"#ffc93c",life:0};if(!B.guest)B.bannerId=(B.bannerId||0)+1;}
// power meter: needle swings, gold = perfect
function bMeter(B,p){const w=BDIFF[B.diff].meter;return new Promise(res=>{const t0=performance.now();B.meter={p,t0,perf:.07*w,good:.19*w,v:0};sfx("touch");
  const done=q=>{B.meter=null;B.input=null;res(q);};
  B.input=()=>{const v=B.meter?B.meter.v:0,d=Math.abs(v-.5);done(d<=B.meter.perf?"perfect":d<=B.meter.good?"good":"bad");};
  const chk=()=>{if(BEACH!==B)return;if(!B.meter)return;if(performance.now()-t0>3400){done("late");return;}requestAnimationFrame(chk);};chk();});}
// dig ring: closes in on your player
function bRing(B,p,dur){return new Promise(res=>{const t0=performance.now();B.ring={p,t0,dur};
  const done=q=>{B.ring=null;B.input=null;res(q);};
  B.input=()=>{const u=(performance.now()-t0)/dur;done(u>=.6&&u<=.97?"perfect":u>=.3&&u<=1.1?"good":"miss");};
  const chk=()=>{if(BEACH!==B)return;if(!B.ring)return;if(performance.now()-t0>dur*1.12){done("none");return;}requestAnimationFrame(chk);};chk();});}
async function bLoop(B){
  while(BEACH===B&&!B.over){await bRally(B);if(BEACH!==B)return;
    const [a,b]=B.score,cap=B.to+4;if((a>=B.to||b>=B.to)&&(Math.abs(a-b)>=2||a>=cap||b>=cap)){B.over=true;bEnd(B);return;}
    await bSleep(B,700);}
}

  if(bIs(p,"Hoshiumi Korai (Sky"))return {ace:.08,err:0,mv:{n:"SKY SERVE",k:"sky"}};

  if(bIs(p,"Oikawa Toru"))return {ace:.06,err:.02,mv:{n:"Killer Serve",k:"killer"}};
  if(bIs(p,"Riseki Heisuke"))return {ace:.05,err:.01,mv:{n:"Pinch Serve",k:"twin"}};
  if(bIs(p,"Shimada Makoto"))return {ace:.04,err:0,mv:{n:"Float Serve",k:"spin"}};

function bSpikeAbil(att,setter,B){const c=att.c;

  if(bIs(att,"Bokuto Kotaro (Owl God"))return {a:6,b:-.03,mv:{n:"HEY HEY HEY!",k:"owlgod"},owl:true};
  if(bIs(att,"Bokuto Kotaro (Owl")){const gap=B?Math.max(0,B.score[1-att.side]-B.score[att.side]):0;return {a:6+Math.min(8,gap*2),b:0,mv:{n:"STRAIGHT HAMMER",k:"owl"}};}
  if(bIs(att,"Ushijima Wakatoshi (Southpaw"))return {a:8,b:0,mv:{n:"LEFT-HAND CRUSHER",k:"crush"},spin:true,crush:true};
  if(c.ult)return {a:4,b:-.04,mv:{n:"LITTLE GIANT!",k:"rainbow"}};
  if(bIs(att,"Hinata Shoyo (Ninja"))return {a:7,b:-.05,mv:{n:"NINJA SHOYO",k:"ninja"}};
  if(bIs(att,"Hinata Shoyo")&&bIs(setter,"Kageyama Tobio"))return {a:8,b:-.06,mv:{n:"FREAK QUICK",k:"freak"}};
  if((bIs(att,"Miya Osamu")&&bIs(setter,"Miya Atsumu"))||(bIs(att,"Miya Atsumu")&&bIs(setter,"Miya Osamu")))return {a:7,b:-.05,mv:{n:"TWIN QUICK",k:"twin"}};
  if(bIs(att,"Ushijima Wakatoshi"))return {a:6,b:0,mv:{n:"Lefty Cannon",k:"lefty"}};
  if(bIs(att,"Sakusa Kiyoomi"))return {a:0,b:0,mv:{n:"Wrist Spin",k:"spin"},spin:true};
  if(bIs(att,"Bokuto Kotaro (Emo"))return Math.random()<.3?{a:-12,b:0,mv:{n:"emo mode…",k:"glow"}}:{a:6,b:0,mv:{n:"COMEBACK SPIKE",k:"fire"}};
  const m=spikeMove(c);return {a:0,b:0,mv:m};}
function bFx(B,e){B.fxId=(B.fxId||0)+1;e.id=B.fxId;B.fxq=(B.fxq||[]).concat([e]).slice(-6);bFxRun(B,e);}
function bFxRun(B,e){
  if(e.k==="deity"){B.deity={x:e.x,y:e.y,life:0};for(let k=0;k<22;k++)B.parts.push({x:e.x+(Math.random()-.5)*240,y:e.y-120-Math.random()*140,vx:(Math.random()-.5)*30,vy:25+Math.random()*30,life:0,max:1.6+Math.random(),c:"#fffdf2",type:"feather",s:5+Math.random()*4});sfx("deity");B.flash={c:"#fff3b0",life:0};}
  else if(e.k==="crow"){B.crow={life:0};sfx("legend");}
  else if(e.k==="owlgod"){B.owlfx={life:0};sfx("owl");}
  else if(e.k==="sky"){B.skyfx={life:0};sfx("sky");}
  else if(e.k==="monster"){if(!RM)B.monfx={life:0,x:e.x,y:e.y};sfx("monster");}
  else if(e.k==="shake")B.shake=.35;

  if(typeof Peer==="undefined"||navigator.onLine===false)return toBot("No internet, so you're playing bots.");

  me.tick=setInterval(()=>bmmSet(`Searching… ${Math.floor((Date.now()-me.start)/1000)}s`),1000);

  const go=(conn,host,d)=>{if(me.cancel)return;me.matched=true;clearTimeout(me.timer);clearInterval(me.tick);clearInterval(me.rescan);
    const keep=host?me.slot:me.searcher;BMM=null;setTimeout(()=>{[me.searcher,me.slot].forEach(p=>{if(p&&p!==keep){try{p.destroy();}catch(e){}}});},2500);
    startBeach({opp:{name:clean(d.name,16)||"Player",pair:d.pair,lv:d.lv,bx:d.bx},net:{conn,peer:keep,host},mm:true});};

      const r=await new Promise(res=>{let ok=false;c.on("data",d=>{if(d&&d.t==="bok"&&validPair(d.pair)){ok=true;res(d);}else if(d&&d.t==="busy")res(null);});c.send({t:"bmm",...beachPayload()});setTimeout(()=>{if(!ok)res(null);},4000);});

  for(let k=0;k<BMM_SLOTS&&!me.slot;k++){if(me.cancel||me.matched)return;const p=await newPeer(BMM_PREFIX+k);if(p){if(me.cancel||me.matched){try{p.destroy();}catch(e){}return;}me.slot=p;me.slotK=k;

const SAVE_KEYS=["spikeProfile","spikeSound","spikeCfg","spikeBest"];

  const j=JSON.stringify(o);let h=0;for(let i=0;i<j.length;i++)h=(h*31+j.charCodeAt(i))>>>0;
  return "WVSAVE1-"+h.toString(36)+"-"+btoa(unescape(encodeURIComponent(j)));}
function readBackup(code){code=String(code||"").trim();const m=code.match(/^WVSAVE1-([0-9a-z]+)-([A-Za-z0-9+/=]+)$/);if(!m)return null;
  try{const j=decodeURIComponent(escape(atob(m[2])));let h=0;for(let i=0;i<j.length;i++)h=(h*31+j.charCodeAt(i))>>>0;if(h.toString(36)!==m[1])return null;

  const cut=Date.now()-LB_KEEP;Object.keys(LB.board).forEach(k=>{if(LB.board[k].at<cut)delete LB.board[k];});
  const keys=Object.keys(LB.board);if(keys.length>400)keys.sort((a,b)=>LB.board[a].at-LB.board[b].at).slice(0,keys.length-400).forEach(k=>delete LB.board[k]);
  try{localStorage.setItem("spikeLB",JSON.stringify(LB.board));}catch(e){}}
async function lbSync(){const me=lbMine();if(me)lbMerge([me]);LB.at=Date.now();
  if(typeof Peer==="undefined"||navigator.onLine===false){LB.status="Offline: showing your saved board";lbPaint();return;}
  if(LB.hub){LB.status="You're hosting the live board";lbPaint();return;}
  const h=await newPeer(LB_HUB);
  if(h){LB.hub=h;LB.status="You're hosting the live board";
    h.on("connection",c=>{c.on("data",d=>{if(!d||d.t!=="lb")return;if(d.e)lbMerge([d.e]);if(d.b)lbMerge(d.b);try{c.send({t:"lbb",b:Object.values(LB.board)});}catch(e){}setTimeout(()=>{try{c.close();}catch(e){}},1500);lbPaint();});});
    h.on("disconnected",()=>{try{h.reconnect();}catch(e){}});lbPaint();return;}
  const p=await newPeer();if(!p){LB.status="Couldn't reach the leaderboard: showing your saved board";lbPaint();return;}
  const c=await tryConnect(p,LB_HUB);
  if(!c){try{p.destroy();}catch(e){}LB.status="Board host just left: showing your saved board";lbPaint();return;}
  await new Promise(res=>{const done=()=>{try{p.destroy();}catch(e){}res();};c.on("data",d=>{if(d&&d.t==="lbb"){lbMerge(d.b);LB.status="Live board updated";done();}});
    c.send({t:"lb",e:me,b:Object.values(LB.board).slice(0,200)});setTimeout(done,6000);});
