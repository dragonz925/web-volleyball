     <button class="passcard" id="passBtn"><span>🎟️</span><b>Season Pass</b><span class="pbar"><div style="width:${passTier()>=PASS_TIERS?100:(prof.pass.xp%PASS_XP)/PASS_XP*100}%"></div></span><small>Tier ${passTier()}/${PASS_TIERS}</small>${passReady()?`<span class="badge">${passReady()}</span>`:""}</button>
     <div class="mecard2">${avatarBox(prof.av,58)}<div class="who"><label class="nmwrap"><input id="nm" maxlength="16" value="${esc(myName)}" aria-label="Your name (friends use it to duel you)"><span aria-hidden="true">✏️</span></label>
       <span class="ttl"><span class="lvchip">Lv ${prof.plv.lv}</span>${presBadge()} ${rankBadge(prof.rp)} <span class="pins">${badgeHTML(prof.pins)}</span></span><span id="duelStat" class="duelstat"></span></div>
       <div class="mecol"><button class="g sm" id="profBtn2">Profile</button><button class="chipb" id="mapChip">🗺️ ${esc(mapOf(prof.mapVote).n)}</button></div></div>
     <div class="minibox"><canvas id="miniC" aria-label="Live mini match"></canvas><div class="miniscore" id="miniScore"></div><div class="minitxt" id="miniTxt"></div>
       <button class="minicfg" id="miniCfg">⚙️ Configure</button><span class="minilive">● LIVE</span></div>
     <p class="err" id="err"></p>
   </div></section>`;
  homeStatus();
  $("nm").onchange=()=>{if(setName($("nm").value))renderHome();else{$("err").textContent="Names need 3–16 letters, numbers or _ (no spaces).";$("nm").value=myName;}};
  $("mPlay").onclick=menuPlay;$("mUp").onclick=menuUpgrade;$("mInfo").onclick=menuInfo;$("mRoom").onclick=menuRoom;
  $("passBtn").onclick=renderPass;$("profBtn2").onclick=renderProfile;$("mapChip").onclick=menuMap;$("miniCfg").onclick=miniConfigure;
  document.querySelectorAll("[data-gull]").forEach(g=>g.addEventListener("click",e=>{e.stopPropagation();e.preventDefault();skyFeather();},true));
  document.querySelectorAll("[data-ev]").forEach(b=>b.onclick=()=>slides[+b.dataset.ev].go());
  document.querySelectorAll("[data-evd]").forEach(b=>b.onclick=()=>{evGo(+b.dataset.evd,slides);restartEv();});
  $("evPrev").onclick=()=>{evGo(EVI-1,slides);restartEv();};$("evNext").onclick=()=>{evGo(EVI+1,slides);restartEv();};
  const car=$("evCar");let paused=false;car.onmouseenter=()=>paused=true;car.onmouseleave=()=>paused=false;
  let sx=null;car.ontouchstart=e=>{sx=e.touches[0].clientX;};car.ontouchend=e=>{if(sx===null)return;const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>40){evGo(EVI+(d<0?1:-1),slides);restartEv();}sx=null;};
  function restartEv(){clearInterval(evTimer);if(SND.power)return;evTimer=setInterval(()=>{if(!$("evTrack")){clearInterval(evTimer);return;}if(!paused&&!document.querySelector(".sheet-bg"))evGo(EVI+1,slides);},7000);}
  evGo(EVI,slides);restartEv();
  miniRun();
}

/* ---------- the full guide ---------- */
let guideTopic=0;
const GUIDE=[
 ["🚀","Getting started",`<p>Welcome to <b>Web Volleyball</b>! You collect Haikyuu player cards, build a team of six, and play volleyball matches against bots, friends and players online.</p>
  <p><b>First steps:</b></p><ol><li>Pick a name on the home screen (click ✏️). Friends use it to send you duels.</li><li>Tap <b>Play → Bots</b> and try a <b>Quick match</b> or an auction to get your first cards.</li><li>Open <b>Upgrade → Team</b> and pick your <b>main team</b> of six. It plays Story, Ranked, duels, the Owl Gauntlet, the Tower and the Halloween boss.</li><li>Check <b>Info → Daily</b> every day for a free card roll and daily quests.</li><li>Back up your save in <b>Profile → Save backup</b> so you never lose progress.</li></ol>`],
 ["▶","Ways to play",`<p><b>Bots</b> (Play → Bots): <i>Normal auction</i> (bid on cards, best team rating wins), <i>Match auction</i> (the top teams play a match) or <i>Quick match</i> (no auction: roll for cards or get a random lineup, then play). You can choose skips per draft, match length, and vote for the map.</p>
  <p><b>Ranked</b>: your main team against real players. If nobody else is queuing, you instantly get a bot instead.</p>
  <p><b>Story</b>: 27 chapters across 6 acts. Beating chapter 23 (the Dream Match) gives the Ultimate <b>Little Giant</b> Hinata.</p>
  <p><b>Curve King Trial</b>: 5 hard stages where you time the spikes and digs yourself. Stage 5 is KUSA. See its own page.</p>
  <p><b>Owl Gauntlet</b>: 5 boss stages in a row. Clear them all for the Ultimate <b>Owl God</b> Bokuto. Every Bokuto gets +4 OVR here.</p>
  <p><b>Infinite Tower</b>: endless floors that keep getting harder, with a weekly spotlight school (+3). Resets weekly.</p>
  <p><b>Beach 2v2</b>: you time every spike and dig yourself. Earns 🏐 beachballs.</p>
  <p><b>Private Room</b>: create a room and share the 4-letter code so friends can join an auction, a quick match or a main-team tournament.</p>
  <p><b>Duels</b>: in Upgrade → Team, type a friend's name and send a live 1v1 duel request, or tap <b>🤖 Duel a bot</b>: the bot's team is built to match your own OVR, so it's always a fair fight (+30 💎 win / +10 loss).</p>
  <p><b>Main-team tournament</b>: in Bots or a Private Room, pick Quick match → <b>Main-team tournament</b>. Everyone uses their own main team (levels, mastery and Shiny count) in a bracket; bots fill empty spots with teams matched to the players.</p>`],
 ["🃏","Cards & rarities",`<p>Every card has an <b>OVR</b> (overall power), a <b>position</b> (S setter, OH outside hitter, OP opposite, MB middle blocker, L libero) and a <b>school</b>.</p>
  <p>Rarities, from lowest to highest: <b>Common</b> → <b>Rare</b> → <b>Epic</b> → <b>Legendary</b> → <b>Mythic</b> → <b>Special</b> (quest rewards) → <b>Limited</b> (limited-time cards, like the Halloween ones) → <b>Evolved</b> → <b>Ultimate</b> → <b>Transcendent</b> (only KUSA).</p>
  <p><b>Getting cards:</b> win them in auctions, roll them in Quick match, get a free roll in Daily, earn them in Story/quests, evolve them, buy Deity Nishinoya in the Shop, or buy Halloween cards with candy in October.</p>
  <p>The <b>Index</b> (Info → Index) shows every card. Cards you don't own are greyed out and say how to get them.</p>`],
 ["⬆","Leveling up cards",`<p>Cards go from <b>Lv 1 to Lv 6</b>. Each level adds <b>+1 OVR</b>, so a maxed card is +5.</p>
  <p><b>Way 1, duplicates (free):</b> when you get a card you already own (from an auction, a roll, the daily roll…), it levels up instead.</p>
  <p><b>Way 2, gems:</b> open <b>Info → Index</b>, tap any card you own, then tap <b>Level up</b>. The cost goes up each level, and rarer cards cost more (Common starts at 60 💎, Ultimate at 800 💎).</p>
  <p>Levels count wherever <i>your own</i> cards play: Story, Ranked, duels, the Gauntlet, the Tower, the Halloween boss and Beach. Auction and Quick-match drafts use base stats so they stay fair.</p>
  <p>On top of levels, cards can earn <b>Mastery stars</b> and can be <b>Shiny</b> (see those pages): up to <b>+11 OVR</b> in total.</p>`],
 ["⭐","Mastery stars",`<p>Every card earns <b>mastery XP</b> just by being in your lineup when a game ends: <b>+10 XP</b>, or <b>+16</b> if you win.</p>
  <p>Stars unlock at 100, 250, 500, 900 and 1,500 XP (★1 to ★5). <b>Each star is +1 OVR</b>, shown as gold stars on the card.</p>
  <p>★5 takes roughly 100+ games with that card, so it's a long-term goal. Tap a card in the Index to see its mastery progress.</p>`],
 ["✨","Shiny cards",()=>`<p><b>Shiny</b> cards have a rainbow holographic shine and <b>+1 OVR</b> forever. Any card can be Shiny, including Specials, Limited, Evolved, Ultimate and Transcendent cards.</p>
  <h3>Way 1: getting it again (free)</h3><p>Whenever you get a card you already own (auctions, Quick-match rolls, the daily roll, rewards) there's a <b>1 in 150</b> chance it turns Shiny. This works even if the card is already Lv 6. Specials and Little Giant can show up in rolls once you've unlocked them.</p>
  <h3>Way 2: the Shiny Forge (Upgrade → Shiny Forge)</h3><p>Pick any card you own and pay gems for a try: each try has a <b>10%</b> chance, and the <b>10th try on a card is guaranteed</b> (your pity is saved per card).</p>
  <div class="gtable">${Object.entries(FORGE_COST).map(([k,v])=>`<div><b>${RAR[k].label}</b><span>💎 ${v.toLocaleString()} per try · max 💎 ${(v*FORGE_PITY).toLocaleString()}</span></div>`).join("")}</div>
  <p>This is the only way to make cards like Deity Nishinoya, Owl God, Hoshiumi (Sky), Evolved and Halloween cards Shiny. Tap any card in the Index: its details say <b>Shiny: Yes</b> or <b>Shiny: No</b> and show a preview of the Shiny version.</p>`],

 ["⚔️","Main team & chemistry",`<p>Your <b>main team</b> is set in <b>Upgrade → Team</b>: tap cards on the right to add them, tap a card in your six to remove it. Your chemistry bonuses show under the rating.</p>
  <p><b>Team rating</b> = average OVR + bonuses: a setter (+3), a libero (+2), a middle blocker (+1), two attackers (+1), plus <b>chemistry</b> (schools, duos and groups) and, in a match, <b>stage buffs</b>. See the "Chemistry & stage buffs" page.</p>
  <p>The setter, libero and blocker spots matter in matches too: the best setter sets, the best libero digs, the best middle blocks.</p>
  <p><b>Loadouts:</b> save up to 3 teams (with tactic and staff) using 💾 and switch with 1 / 2 / 3. <b>⚡ Auto-build best</b> picks the highest-rated six from your own cards, optionally for a specific map so stage buffs count.</p>`],
 ["🧢","Tactics & staff",`<p><b>Tactics</b> (Team screen) change how your team plays: Balanced, Serve aggressive (more aces and errors), Feed the ace (best hitter gets more sets), Block focus, Dig focus.</p>
  <p><b>Staff</b>: buy one coach or manager with gems and put them in your staff slot. Yachi (fewer errors), Kiyoko (comeback boost), Nekomata (+dig), Ukai (+set). Staff help in every mode with your main team, including Beach.</p>`],
 ["🏐","How matches work",`<p>Matches are simulated rally by rally. You'll see serves, passes, sets, spikes, blocks and digs.</p>
  <p><b>Rotations:</b> all six players rotate clockwise every time a team wins back the serve. Everyone takes a turn serving.</p>
  <p><b>Front & back row:</b> front-row players spike at the net and block; back-row players receive and can hit <b>back-row attacks</b> (the back-middle one is a <b>pipe</b>). Liberos never spike or block.</p>
  <p><b>Abilities</b> trigger by themselves, with banners and effects: Cannon Spike, Lightning Quick, Jump Serve, Monster Block, Miracle Dig, plus signature moves like Freak Quick, Twin Quick, Killer Serve, Lefty Cannon, Wrist Spin, Read Block and Guess Block, and evolved/ultimate moves.</p>
  <p><b>Auto skip</b> (⏭️ at the top) jumps straight to results in matches you just watch.</p>`],
 ["⚡","Team Plays",`<p>Each team has a <b>Team Play meter</b> under its name. It fills when you win points (+20%), lose points (+8%) and dig big spikes (+6%).</p>
  <p>When it's full, your next attack becomes a Team Play:</p><ul><li><b>Synchronized Attack</b>: everyone runs in, the blockers bite on the decoys and your best hitter spikes through. Almost never blocked.</li>
  <li><b>Libero Toss</b>: if your libero is 85+ OVR and in the back row, they leap from behind the 3m line and set your ace. Huge set bonus.</li></ul><p>Team Plays only happen indoors (not Beach).</p>`],
 ["💞","Chemistry",()=>`<p><b>Chemistry</b> raises your team rating <i>and</i> makes linked players play at higher OVR in real matches (each player can get up to <b>+5</b> from chemistry). Your active chemistry shows as chips under your rating in <b>Upgrade → Team</b>.</p>
  <h3>🏫 School chemistry</h3><p>2 or more players from the same school: <b>+1.5 rating</b> for each extra player. In matches each of them gets <b>+1 OVR</b> (<b>+2</b> with 4 or more). Example: 4 Karasuno players = +4.5 rating, each +2 OVR.</p>
  <h3>💞 Duos (${DUOS.length})</h3><p>Famous pairs. <b>Any version</b> of each character counts (Little Giant Hinata and Timeskip Kageyama still make the Freak Duo). Each duo: <b>+2 rating</b> and <b>+2 OVR</b> for both. Duos also work in Beach 2v2 (+2 each).</p>
  <div class="gtable">${DUOS.map(([a,b,n])=>`<div><b>${esc(n)}</b><span>${esc(a)} + ${esc(b)}</span></div>`).join("")}</div>
  <h3>✦ Groups</h3><p>2 or more cards from a group: <b>+1.5 rating</b> per extra card, <b>+1 OVR</b> each (<b>+2</b> with 4 or more).</p>
  <div class="gtable"><div><b>Pro League</b><span>Timeskip cards and Season MVP Akaashi</span></div><div><b>Halloween</b><span>Ghost Kenma, Vampire Oikawa, Pumpkin Tendo</span></div><div><b>Evolved</b><span>Ninja Shoyo and all 8 evolutions</span></div><div><b>World Stage</b><span>Hinata (Brazil), Yaku (Russia), Oikawa (Argentina)</span></div><div><b>Legends</b><span>Little Giant, Deity Nishinoya, Owl God</span></div></div>
  <h3>Tips</h3><ul><li>A card can be in a school, several duos and a group at the same time, so the bonuses stack (still max +5 OVR per player in matches).</li><li>Two versions of the same character (like Owl God + Owl Ace Bokuto) share a school but don't count as a duo with each other.</li></ul>`],
 ["🏟️","Stage buffs",()=>`<p><b>Stage buffs</b> make certain cards stronger depending on <i>where</i> and <i>what</i> you play. They apply to <b>both teams</b> and show at the start of every match, so the best team changes from mode to mode.</p>
  <h3>Maps</h3><div class="gtable">${MAPS.map(m=>{const r=stageRules("map:"+m.id)[0];return `<div><b>${m.e} ${esc(m.n)}</b><span>${r?`${esc(r.n)}: <b>+${r.b} OVR</b>`:"No buff"}</span></div>`;}).join("")}</div>
  <p>Arena "pros" means Timeskip cards plus MSBY Black Jackals, Schweiden Adlers, Sendai Frogs, Argentina, Russia and Beach Brazil.</p>
  <h3>Modes</h3><div class="gtable"><div><b>🦉 Owl Gauntlet</b><span><b>Every Bokuto</b> (regular, Timeskip, Emo, Owl Ace, Owl God) <b>+4 OVR</b>, on both teams</span></div>
   <div><b>🎃 Halloween boss</b><span>Halloween cards <b>+4 OVR</b> (stacks with the Haunted Court for +8)</span></div>
   <div><b>🗼 Infinite Tower</b><span>A weekly <b>spotlight school +3 OVR</b> (this week: <b>${esc(towerFeat())}</b>). Rotates through Karasuno, Nekoma, Fukurodani, Aoba Johsai, Shiratorizawa, Inarizaki, Itachiyama, Kamomedai.</span></div>
   <div><b>🏖️ Beach 2v2</b><span>Beach Brazil cards <b>+6</b> on sand</span></div>
   <div><b>Ranked, duels, rooms, Story</b><span>Only the map's buff</span></div></div>
  <h3>Best team ideas (all cards maxed)</h3><ul>
   <li><b>Plain courts:</b> Little Giant, Deity Nishinoya, Owl God, Kageyama (Timeskip), Akaashi (Season MVP), Hoshiumi (Timeskip).</li>
   <li><b>Karasuno Gym:</b> Little Giant, Deity, Crowned King, Owl God, Total Defense Tsukishima, Grand King Oikawa.</li>
   <li><b>Nekoma Gym:</b> Little Giant, Deity, Owl God, Crowned King, Game Master Kenma, Scheming Captain Kuroo.</li>
   <li><b>Tokyo Arena:</b> a full pro squad: Timeskip Hinata, Kageyama, Ushijima, Bokuto, Hoshiumi + Argentina Oikawa.</li>
   <li><b>Neon Night:</b> Crowned King, Little Giant, Deity, Total Defense, Game Master, Scheming Captain (Evolved cards shine).</li>
   <li><b>Haunted Court / Halloween boss:</b> Vampire Oikawa, Pumpkin Tendo, Little Giant, Deity, Southpaw Ushijima, Crowned King.</li>
   <li><b>Owl Gauntlet:</b> bring Bokutos! Owl God (and Owl Ace) get +4 on top of everything else.</li></ul>
  <p>Your map vote (🗺️ on your home profile card) decides the map in Ranked/duels half the time, so set it to the map your team is built for.</p>`],
 ["🏅","Leaderboard",()=>`<p>Info → <b>Leaderboard</b> ranks everyone who plays (you need a name). Categories: ${LB_CATS.map(c=>c[1]+" "+c[2]).join(", ")}.</p><p>It <b>refreshes every 5 minutes</b> (or tap ↻ Refresh now). There's no central server: whoever is online first hosts the board and everyone's game shares it, and your game keeps a saved copy so it's never empty. Players who haven't played for 30 days drop off. Stats come from each player's game, so it's a friendly competition, not cheat-proof.</p>`],
 ["🌀","Chaos mode",()=>`<p>Play → <b>Chaos mode</b>: your main team vs a bot team matched to your rating, with <b>3 random modifiers</b> that change how the match plays:</p><div class="gtable">${CHAOS.map(m=>`<div><b>${m.e} ${esc(m.n)}</b><span>${esc(m.d)}</span></div>`).join("")}</div><p>Win: +40 💎, loss: +15 💎. After a match pick 🎲 New chaos or keep the same modifiers.</p>
  <h3>With friends</h3><p><b>Private Room:</b> the host turns on <b>🌀 Chaos mode</b> in the game settings (Match auction or Quick match). Every match gets 3 random modifiers, the same for everyone.</p><p><b>Duels:</b> tick <b>🌀 Chaos duel</b> on the Team screen before sending a request. Your friend sees "Chaos duel request".</p>`],
 ["🗺️","Maps",`<p>Every indoor match is on a map: Classic Gym, Karasuno Gym, Nekoma Gym, Seijoh Court, Tokyo Arena (with a crowd), Neon Night, Sakura Court, and the <b>Haunted Court</b> in October.</p>
  <p>Most maps also give a <b>stage buff</b> to certain cards (see the Stage buffs page).</p>
  <p>Your <b>map vote</b> (the 🗺️ button on your home profile card) is also your page background colour. In auctions everyone votes; in Ranked and duels it's 50/50 between both players' votes.</p>
  <p>The live mini match on the home screen has its own court: change it with <b>⚙️ Configure</b>.</p>`],
 ["🏖️","Beach 2v2",`<p>You pick 2 players and <b>time every hit yourself</b>:</p><ul><li><b>Spike</b>: a meter swings; press SPACE, click or tap HIT when the needle is in the <b>gold</b> zone for a PERFECT SPIKE (big bonus, purple trail).</li>
  <li><b>Dig</b>: a ring closes in on your player; press when it turns <b>gold</b> for a PERFECT DIG.</li></ul>
  <p>Abilities, staff and tactics work on the beach too. Beach Brazil cards get +6. A perfect spike slows time down a little for style (Little Giant barely at all).</p><p>Each win gives <b>50 🏐 beachballs</b> (for Ninja Shoyo and Beach Packs). Play bots, a friend, or matchmake; bot games from matchmaking can be skipped.</p>`],
 ["🧬","Evolutions",`<p>Open <b>Upgrade → Evolutions</b>. Own the base card, earn its currency, then evolve it into an <b>Evolved</b> card with its own move:</p>
  <ul><li>Ninja Shoyo: 1,000 🏐 (Beach wins)</li><li>Crowned King: 500 👑 (+10 per Ranked win)</li><li>Owl Ace: 60 🪶 (Bokuto kills/aces)</li><li>Southpaw Monster: 400 🏆 (+20 per Story win)</li><li>Grand King Unbound: 25 🎯 (Oikawa aces)</li><li>Game Master: 150 🎮 (Quick-match rolls)</li><li>Total Defense: 150 🧱 (your team's block points)</li><li>Twin Tempo: 10 ⚔️ (duel wins)</li><li>Scheming Captain: 10 🐈 (online room wins)</li></ul>`],
 ["👑","Ultimates",`<p>The rarest cards (100 OVR, up to 105+):</p><ul><li><b>Hinata (Little Giant)</b>: beat Story chapter 23. Crow shadow on kills.</li><li><b>Nishinoya (Deity)</b>: 10,000 💎 in the Shop. Rolling Thunder digs with a pillar of light.</li><li><b>Bokuto (Owl God)</b>: clear the Owl Gauntlet. Every kill powers up the team; giant golden owl.</li>
  <li><b>Tendo (Monster's Domain)</b>: 100 OVR middle blocker. <b>Ranked reward: reach Diamond 3</b> (your best rank ever counts). GUESS MONSTER: a huge blocking bonus, and every hitter he stuffs plays weaker for the rest of the match (−2 each time, up to −6). When he blocks, the court goes dark and two giant red eyes open behind the net.</li>
  <li><b>Hoshiumi (Sky)</b>: 105 OVR, the highest of all. 💎 50,000, and… <span class="secret">Secret</span>. His kills open the sky over the court.</li></ul>
  <p><i>Rumor has it the sky only listens to players who climb past the clouds, strike at the perfect moment, win with wings beside them, and keep an eye on the birds.</i></p>
  <p>Above Ultimate there's one <b>Transcendent</b> card: <b>KUSA</b> (see his page).</p>
  <p>Tap any card in the Index to see how to get it.</p>`],
 ["🌑","KUSA (Transcendent)",()=>`<p><b>KUSA, The Curve King</b> is the first fully original character and the only <b>Transcendent</b> card, a rarity above Ultimate. <b>110 OVR</b>, plays OH (all-rounder / curve specialist). He isn't secret: every requirement is on his screen (<b>Info → KUSA</b>, or the Trial's <b>KUSA requirements</b> button).</p>
  <h3>🌀 Curve Mastery</h3><p>Every spike he hits curves in the air: <b>around the block</b> (much harder to block), <b>toward the line</b> (harder to dig, slightly riskier), <b>out… and back in</b> (defenders let it go: the hardest to dig) or a <b>late hook</b> (beats both a bit). You can't choose the curve.</p>
  <h3>⚡ Perfect Curve</h3><p>Normal curves are riskier, good ones beat blocks, and a <b>Perfect Curve</b> gives <b>+10 Spike Power</b> for that attack and his next one. It refreshes but never stacks. In Beach, a perfectly timed KUSA spike is always a Perfect Curve.</p>
  <h3>🔗 Original Resonance</h3><div class="gtable">${RESO.map((r,k)=>`<div><b>${["Alone","1 partner","2 partners","3+ partners"][k]}: ${r[0]}</b><span>team +${r[1]} · KUSA +${r[2]} · partners +${r[3]} · everyone else +${r[4]}</span></div>`).join("")}</div><p>Partners: Bokuto, Hinata, Atsumu, Hoshiumi, Oikawa, Ushijima, Kageyama, Sakusa and Tendo (any version).</p>
  <h3>Requirements</h3><ul>${kusaReqs().map(r=>`<li>${r.e} ${esc(r.t)}${r.s?` <i>(${esc(r.s)})</i>`:""}: <b>${r.ok?"✓":`${r.v.toLocaleString()}/${r.g.toLocaleString()}`}</b></li>`).join("")}</ul>
  <h3>📜 The Original questline</h3><ol>${OL.map(c=>`<li><b>${esc(c.t)}</b>: ${esc(c.d)}</li>`).join("")}</ol><p>Each chapter starts counting when you reach it. When the last requirement is done, KUSA unlocks by himself, with his own reveal.</p>`],
 ["🌒","The Curve King Trial",()=>`<p><b>Play → Curve King Trial</b> (or the black banner on the home screen). A 5-stage PvE challenge with your <b>main team</b>. Clearing it is one of KUSA's requirements.</p>
  <p><b>How it plays:</b> your players play automatically, but you time the big moments like in Beach. When your hitter gets the set, stop the <b>spike meter</b> in the gold. When they attack or serve, tap as the <b>ring</b> hits the gold band. Use SPACE, tap the court, or the HIT button. Perfect timing hits harder and digs more, bad timing costs you. Every match is <b>first to 15</b>, and there's no skipping.</p>
  <div class="gtable">${KT_STAGES.map((st,k)=>`<div><b>${k+1}. ${st.e} ${st.n}</b><span>${esc(st.d)}</span></div>`).join("")}</div>
  <h3>🃏 Trial Cards</h3><p><b>Stage 4:</b> pick 1 of ${KT_C4.map(c=>`<b>${c.n}</b> (${esc(c.d)})`).join(", ")}.</p><p><b>Stage 5:</b> equip up to 5 of: ${KT_C5.map(c=>`<b>${c.n}</b> (${esc(c.d)})`).join(" · ")}</p>
  <h3>🌑 The Original</h3><p>KUSA plays for the other team, next to a blocker that reads your best hitter and a libero that learns from every kill you get. At <b>10–10</b> he becomes <b>THE CURVE KING</b> (more aggressive, more curves, harder Perfect Curves). At <b>14–14</b> it's <b>THE ORIGINAL</b>: every Trial Card turns off and the next point wins.</p>
  <h3>Winning and losing</h3><p>Beat all 5 stages for <b>TRIAL COMPLETE</b> (and KUSA, if the rest is done). Lose a stage and the run ends with <b>TRIAL FAILED</b> and your stats: best stage, highest score, KUSA points allowed, Perfect Curves received, best and worst character, and team chemistry. You keep all gems, XP and mastery and can <b>try again</b> right away. You can change your main team between stages, and leaving during a Trial match counts as a loss.</p>
  <p>Rewards: 💎 ${KT_STAGES.map(st=>st.gems).join(" / ")} for clearing each stage, 20 💎 for a loss.</p>`],
 ["⭐","Quests & Daily",`<p><b>Quests</b> (Upgrade → Quests) unlock Special cards like the Timeskip versions. Claim them when the progress bar is full.</p>
  <p><b>Daily</b> (Info → Daily): a login bonus, one free card roll, and 3 daily quests every day.</p>`],
 ["🎟️","Season Pass",`<p>Every game gives Season Pass XP (120 for a win, 60 for a loss). 30 tiers reset every month.</p><p>The <b>Free</b> track gives gems, beachballs, evolution currency, packs and the Season Ball. <b>Premium</b> (1,500 💎) adds a second reward each tier, the Champion Ball and the Season MVP Akaashi card.</p>`],
 ["🎖️","Player level & prestige",`<p>Your <b>player level</b> (1–100) goes up with every game (+40 XP, +80 for a win), quest (+100) and achievement (+60).</p>
  <p>Each level has a reward (gems, beachballs, evolution currency); claim them on your <b>Profile</b>. Level 25, 50 and 100 give exclusive balls (Star, Platinum and the rainbow Legend Ball).</p>
  <p>At level 100 you can <b>Prestige</b>: back to level 1, +1,000 💎 and a prestige star (★P1, ★P2…) next to your name.</p>`],
 ["🗼","Infinite Tower",`<p>Play → <b>Infinite Tower</b>. Climb floor after floor with your main team. Each floor is stronger; from floor 10 the enemy gets a modifier (Iron Wall, Serve Storm, Fortress…); from floor 15+ they use Specials, then Evolved, then Ultimates.</p>
  <p>Each week one <b>spotlight school</b> gets +3 OVR in the Tower (shown on the Tower screen), so build around it.</p>
  <p>Every floor gives gems, and every 5th floor is a 🎁 <b>chest</b> with gems, beachballs and evolution currency. Lose and you can retry the same floor. Your progress resets every week, but your <b>best floor</b> is kept.</p>`],
 ["🏆","Ranked",`<p><b>Reward:</b> reaching <b>Diamond 3</b> (1,600 RP) unlocks the Ultimate <b>Tendo (Monster's Domain)</b>. The Ranked screen shows your progress.</p><p>Ranks: Bronze 1–3, Silver 1–3, Gold 1–3, Platinum 1–3, Diamond 1–3, Legend. Win vs a player +25 RP, lose −18; vs a bot +15 / −10.</p><p>Seasons are monthly; season rewards depend on your best tier. Turn on 🔁 <b>Auto queue</b> at the top to search again after every game.</p>`],
 ["🤝","Playing with friends",`<p><b>Private Room:</b> one person creates a room and shares the 4-letter code; everyone joins, votes for a map, and plays an auction, a quick match, or a <b>main-team tournament</b> (Quick match → Main-team tournament): everyone brings their main team, and if there are fewer than 4 players, bots fill in with teams matched to your strength.</p>
  <p><b>Duels:</b> Upgrade → Team → type their name → Send. They get a popup and you play a live 1v1 where you can change tactics and send emotes. Beach duels work the same from the Beach hub.</p>
  <p>Friends need the game open (it can be in a background tab) and the <b>same version</b> of the file. If a request doesn't show up for them, they need to update.</p>`],
 ["🛍️","Shop, balls & packs",`<p><b>Shop</b> (Upgrade → Shop): avatar parts, frames, titles and Deity Nishinoya. The <b>Balls & packs</b> tab has Basic, Premium and Legend packs (a Legendary is guaranteed within 15 packs). Duplicates refund gems.</p>
  <p>Your equipped ball is used in every match and as your spinning cursor. Beach Packs (special beach balls) are in the Beach hub; Halloween balls are in the candy shop.</p>`],
 ["🏅","Achievements & profile",`<p>Info → <b>Profile</b> shows your stats, favorite card, player level and achievements. Claim achievements for gems and tap earned ones to pin up to 3 badges next to your name.</p>`],
 ["🎃","Halloween event",()=>`<p>Runs all of <b>October</b> (open it from the event banner or <b>Play → Halloween</b>). Everything you get stays yours after Halloween.</p>
  <h3>🍬 Candy</h3><p>Every game you play gives candy: <b>10</b>, or <b>25</b> for a win. Plus <b>daily candy quests</b> (reset each day): play 3 games (60), win with a Halloween card in your lineup (80), win a match on the Haunted Court (100).</p>
  <h3>👻 Boss path</h3><p>Three bosses in a row, with your main team:</p><div class="gtable">${HBOSSES.map((b,k)=>`<div><b>${k+1}. ${esc(b.n)}</b><span>First win: ${b.first} 🍬${b.ball?` + the ${esc(ballOf(b.ball).n)}`:""} · replays: ${b.again} 🍬</span></div>`).join("")}</div>
  <p>Halloween cards get <b>+4</b> on the Haunted Court and <b>+4 more</b> against the bosses (on both teams).</p>
  <h3>🃏 Halloween cards (candy shop)</h3><div class="gtable">${HSHOP2.filter(i=>i.k==="card").map(i=>`<div><b>${esc(ch(i.i).name)} · ${i.cost} 🍬</b><span>${esc(i.d)}</span></div>`).join("")}</div>
  <p>All six count as the <b>Halloween</b> chemistry group, and their moves work indoors and on the beach.</p>
  <h3>🧪 Pumpkin Elixir</h3><p>20,000 🍬: pick any card you own and instantly max its level (Lv 6, +5 OVR). Works on any card, including Ultimates.</p>
  <h3>🏐 Balls & the Mystery Bucket</h3><p>Jack-o'-Lantern, Skull, Candy Corn and Ghost balls are in the candy shop (and from bosses). The <b>Mystery Candy Bucket</b> (150 🍬) gives gems, beachballs, evolution currency, more candy, a Halloween ball, or a 3% chance at a Halloween card you don't have.</p>
  <h3>🗺️ Haunted everything</h3><p>The <b>Haunted Court</b> map (bats, fog, pumpkins) is available all month,.</p>
  <h3>🏅 Halloween achievements</h3><p>Candy Collector (earn 2,000 candy), Ghostbuster (beat all 3 bosses), Full Moon (own all 6 Halloween cards).</p>`],

 ["⚙️","Settings & saving",`<p><b>📜 Update log:</b> Info → Update log (or the button in Settings) lists every big update, newest first.</p><p><b>Keyboard shortcuts:</b> on the home screen P = Play, U = Upgrade, I = Info, R = Private Room, S = Settings. In a watched match, S = Skip. Esc closes menus. Tap a notification to dismiss it.</p><p>Tap <b>⚙️ Settings</b> at the top right:</p><ul><li><b>Sound effects</b> and <b>Music</b>.</li><li><b>🧍 Human Mode</b>: on = animated players with poses, off = the classic circles. Only changes how players look.</li><li><b>Auto skip</b>: jump straight to the result in matches you only watch.</li>
  <li><b>Auto continue</b>: after a game, it counts down 5 seconds and then plays the <b>next</b> chapter / Gauntlet stage / Tower floor / boss if you won, or <b>replays</b> if you lost or there's no next one. In Ranked and Beach matchmaking it searches again. Tap <b>Stop</b> to cancel.</li>
  <li><b>🔋 Power saver</b>: the one-tap battery mode. Pauses the home background match, stops music and banner auto-rotation, removes blur, glow and every animation, caps matches at 30 FPS and draws at normal resolution.</li>
  <li><b>Reduce effects</b>, <b>30 FPS cap</b>, <b>Lower resolution</b>: the same savings one at a time.</li>
  <li><b>Classic cursor</b>: use your normal mouse pointer instead of the spinning volleyball. <b>Skip intro</b>: no opening animation.</li></ul><p>Your progress lives in this browser. Use <b>Profile → Save backup</b> to copy a backup code or download a file, and <b>Restore</b> to bring it back on any device.</p>`]];
/* ---------- Guide 2: compact, searchable, smooth ---------- */
const GUIDE_CATS=[["Basics",["Getting started","Ways to play","Playing with friends","Settings & saving"]],["Cards",["Cards & rarities","Leveling up cards","Mastery stars","Shiny cards","Evolutions","Ultimates"]],
 ["Teams & matches",["Chaos mode","Main team & chemistry","Chemistry","Stage buffs","Tactics & staff","How matches work","Team Plays","Maps","Beach 2v2"]],
 ["Endgame",["KUSA (Transcendent)","The Curve King Trial"]],
 ["Progress",["Leaderboard","Quests & Daily","Season Pass","Player level & prestige","Infinite Tower","Ranked","Shop, balls & packs","Achievements & profile"]],["Events",["Halloween event"]]];
const GUIDE_TLDR={"Getting started":"Name → Bots → build your main team → Daily → back up your save.","Ways to play":"Bots · Ranked · Story · Owl Gauntlet · Tower · Beach · rooms · duels (friends or bots).",
 "Cards & rarities":"Common → Rare → Epic → Legendary → Mythic → Special → Limited → Evolved → Ultimate → Transcendent.","Leveling up cards":"Lv 1–6 = +5 OVR. Duplicates (free) or gems in the Index.",
 "Mastery stars":"+10 XP per game, +16 per win. ★1–★5 = +5 OVR.","Shiny cards":"+1 OVR. 1/150 on repeats, or the Shiny Forge (10% per try, 10th guaranteed).",
 "Main team & chemistry":"Rating = average OVR + position bonuses + chemistry + stage buffs.","Chemistry":"Schools, 24 duos and 5 groups. Up to +5 OVR per player in matches.",
 "Stage buffs":"Maps and modes boost certain cards for both teams.","Tactics & staff":"5 tactics + 1 staff slot (Yachi, Kiyoko, Nekomata, Ukai).",
 "How matches work":"Rotations, back-row attacks, automatic special moves.","Team Plays":"Full meter → Synchronized Attack or Libero Toss.","Maps":"8 maps, each with its own look and buff.",
 "Beach 2v2":"You time spikes (gold zone) and digs (gold ring). Wins give 50 🏐.","Evolutions":"9 evolved cards, each with its own currency.","Ultimates":"Little Giant · Deity · Owl God · Hoshiumi (Sky) · Tendo (Monster's Domain).","KUSA (Transcendent)":"110 OVR original. Curving spikes, Perfect Curve +10, chemistry with every team. 14 visible requirements.","The Curve King Trial":"5 stages, first to 15, you time spikes and digs. Beat KUSA in Stage 5. Lose = run over (you keep everything).",
 "Quests & Daily":"Quests unlock Specials; Daily gives a free roll and 3 quests.","Season Pass":"Monthly, 30 tiers, XP from every game.","Player level & prestige":"Lv 1–100, rewards each level, prestige stars after 100.",
 "Infinite Tower":"Endless floors, chest every 5, weekly spotlight school, weekly reset.","Ranked":"Bronze → Legend. Win +25 RP vs players.","Playing with friends":"Rooms by code (auction, quick, or main-team tournament) and live duels.",
 "Shop, balls & packs":"Avatar items, ball packs (pity 15), legend cards.","Achievements & profile":"Claim achievements, pin 3 badges, back up your save.","Halloween event":"October: candy, 3 bosses, 6 Halloween cards, Mystery Bucket.",
 "Settings & saving":"Sound, Human Mode, auto skip/continue, power saver, backups."};
let guideQ="";
function guideBody(k){const g0=GUIDE[k],html=typeof g0[2]==="function"?g0[2]():g0[2];const tl=GUIDE_TLDR[g0[1]];
  return `<div class="gfade"><h2>${g0[0]} ${g0[1]}</h2>${tl?`<div class="gtldr"><b>In short</b>${esc(tl)}</div>`:""}${html}
    <div class="row gpn">${k>0?`<button class="g sm" data-gnav="${k-1}">← ${esc(GUIDE[k-1][1])}</button>`:""}${k<GUIDE.length-1?`<button class="b sm" data-gnav="${k+1}">${esc(GUIDE[k+1][1])} →</button>`:""}</div></div>`;}
function renderGuide(){
  mode=null;clearInterval(loop);shellKey="";curScreen=renderGuide;setTop();
  const idxOf=t=>GUIDE.findIndex(g=>g[1]===t);
  const navHTML=()=>{const q=guideQ.toLowerCase();return GUIDE_CATS.map(([cat,ts])=>{const items=ts.map(idxOf).filter(k=>k>=0).filter(k=>!q||GUIDE[k][1].toLowerCase().includes(q)||String(typeof GUIDE[k][2]==="function"?GUIDE[k][2]():GUIDE[k][2]).replace(/<[^>]+>/g," ").toLowerCase().includes(q)||(GUIDE_TLDR[GUIDE[k][1]]||"").toLowerCase().includes(q));
    return items.length?`<div class="gcat">${cat}</div>${items.map(k=>`<button class="gtopic ${k===guideTopic?"on":""}" data-gt="${k}"><span>${GUIDE[k][0]}</span>${esc(GUIDE[k][1])}</button>`).join("")}`:"";}).join("")||'<p class="hint">No topics match.</p>';};
  $("app").innerHTML=`<section class="screen guide3"><nav class="panel gnav2" aria-label="Guide topics"><div class="ghead"><h2 class="setup-h">🧭 Guide</h2><input id="gSearch" placeholder="Search the guide…" value="${esc(guideQ)}" aria-label="Search the guide"></div><div class="glist" id="gList">${navHTML()}</div></nav>
   <article class="panel gbody2" id="gBody">${guideBody(guideTopic)}</article></section>`;
  const wire=()=>{document.querySelectorAll("[data-gt],[data-gnav]").forEach(b=>b.onclick=()=>{guideTopic=+(b.dataset.gt??b.dataset.gnav);
    $("gBody").innerHTML=guideBody(guideTopic);$("gBody").scrollTop=0;document.querySelectorAll(".gtopic").forEach(x=>x.classList.toggle("on",+x.dataset.gt===guideTopic));wire();});};
  $("gSearch").oninput=e=>{guideQ=e.target.value;$("gList").innerHTML=navHTML();const first=document.querySelector("#gList [data-gt]");if(guideQ&&first&&!document.querySelector("#gList .gtopic.on")){guideTopic=+first.dataset.gt;$("gBody").innerHTML=guideBody(guideTopic);first.classList.add("on");}wire();};
  wire();
}

/* final save check: runs after EVERY card (ultimates, evolutions, season cards) exists,
   so nothing newer gets dropped from your Index or your main team on reload */
(function(){if(!RAW_PROF)return;
  if(Array.isArray(RAW_PROF.idx))RAW_PROF.idx.forEach(i=>{if(isCard(i)&&!prof.idx.includes(i))prof.idx.push(i);});
  if(Array.isArray(RAW_PROF.main)){const m=RAW_PROF.main.filter((i,k,a)=>isCard(i)&&prof.idx.includes(i)&&a.indexOf(i)===k).slice(0,ROSTER);if(m.length>=prof.main.length)prof.main=m;}
  if(RAW_PROF.lv&&typeof RAW_PROF.lv==="object")Object.keys(RAW_PROF.lv).forEach(k=>{if(isCard(+k)&&!(prof.lv[k]>RAW_PROF.lv[k]))prof.lv[k]=Math.min(MAX_LV,RAW_PROF.lv[k]|0);});
  // Shiny cards: newer cards (Tendo, Hoshiumi, Halloween cards, evolutions…) were being dropped on reload
  if(Array.isArray(RAW_PROF.shiny))RAW_PROF.shiny.forEach(i=>{if(isCard(i)&&!prof.shiny.includes(i))prof.shiny.push(i);});
  if(RAW_PROF.mast&&typeof RAW_PROF.mast==="object")Object.keys(RAW_PROF.mast).forEach(k=>{if(isCard(+k)&&!((prof.mast[k]|0)>(RAW_PROF.mast[k]|0)))prof.mast[k]=RAW_PROF.mast[k]|0;});
  if(Array.isArray(RAW_PROF.ach))RAW_PROF.ach.forEach(x=>{if(ACH.some(a=>a.id===x)&&!prof.ach.includes(x))prof.ach.push(x);});
  if(Array.isArray(RAW_PROF.pins))RAW_PROF.pins.forEach(x=>{if(prof.ach.includes(x)&&!prof.pins.includes(x)&&prof.pins.length<3)prof.pins.push(x);});
  if(Array.isArray(RAW_PROF.balls))RAW_PROF.balls.forEach(b=>{if(BALLS.some(x=>x.id===b)&&!prof.balls.includes(b))prof.balls.push(b);});
  if(typeof RAW_PROF.ball==="string"&&prof.balls.includes(RAW_PROF.ball))prof.ball=RAW_PROF.ball;
  if(Array.isArray(RAW_PROF.q))RAW_PROF.q.forEach(x=>{if(!prof.q.includes(x)&&QUESTS.some(q=>q.id===x))prof.q.push(x);});
  saveProf();})();
dailyInit();sndBar();setCursor();applyBgMap();applyPower();playIntro();monCheck();
// autosave: every 15 seconds, and whenever the tab is hidden or closed
setInterval(()=>{if(!document.hidden)saveProf();},15000);
addEventListener("pagehide",()=>saveProf());document.addEventListener("visibilitychange",()=>{if(document.hidden)saveProf();});
setTimeout(lbStart,4000);
if(prof.lastVer!==GAME_VER)setTimeout(()=>{toast(`<b>📜 Update ${GAME_VER}!</b> Tap here to see what's new.`);const t=document.querySelector(".toasts .toast:last-child");if(t)t.onclick=()=>{t.remove();openUpdates();};},3200);renderHome();startListener();if(SND.music)startMusic();
setTimeout(()=>{if(seasonMsg)toast(seasonMsg);if(dailyMsg)toast(dailyMsg);if(restoredLG)toast("<b>Little Giant restored!</b> Sorry, a bug removed it. It's back in your Index. Add it to your main team again.");},600);
</script>
